<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){
  var s=localStorage.getItem('ruvia-dark');
  if(s==='1'||(!s&&window.matchMedia('(prefers-color-scheme:dark)').matches))
    document.documentElement.classList.add('dark-mode'),document.documentElement.style.background='#0f1117';
})()</script>
<script src="ruvia-auth-guard.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RuviaOS — Front Desk</title>
<script>(function(){if(localStorage.getItem('ruvia-dark')==='1')document.documentElement.style.background='#0f1117';})()</script>
<link rel="stylesheet" href="darkmode.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6f9;--card:#fff;--text:#1a1a2e;--text2:#6b7280;--border:#e5e7eb;--accent:#2c5f4a;--accent-light:#e8f5f0;--input-bg:#fff;--th-bg:#f9fafb;--row-hover:#f3f4f6;--shadow-md:0 4px 16px rgba(0,0,0,.08)}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
.page{max-width:1400px;margin:0 auto;padding:24px}
.page-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-hdr h1{font-size:22px;font-weight:700}
.btn-primary{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;border-left:4px solid var(--accent)}
.tile.warn{border-left-color:#e0a800}.tile.info{border-left-color:#17a2b8}.tile.success{border-left-color:#28a745}
.tile-icon{font-size:22px;margin-bottom:6px}
.tile-val{font-size:26px;font-weight:700;color:var(--accent)}
.tile.warn .tile-val{color:#e0a800}.tile.info .tile-val{color:#17a2b8}.tile.success .tile-val{color:#28a745}
.tile-lbl{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
/* layout */
.layout{display:grid;grid-template-columns:1fr 370px;gap:18px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
/* room grid card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.card-hdr{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.card-hdr h3{font-size:14px;font-weight:700}
.fstrip{display:flex;gap:5px;flex-wrap:wrap}
.fbtn{padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;transition:.15s}
.fbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.rooms-grid{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
/* room tile */
.rtile{border-radius:11px;padding:12px;text-align:center;cursor:pointer;transition:.18s;border:2px solid transparent;position:relative}
.rtile:hover{transform:scale(1.06);box-shadow:var(--shadow-md)}
.rtile.ready{background:rgba(40,167,69,.1);border-color:rgba(40,167,69,.35)}
.rtile.occupied{background:rgba(220,53,69,.1);border-color:rgba(220,53,69,.3)}
.rtile.dirty{background:rgba(224,168,0,.1);border-color:rgba(224,168,0,.35)}
.rtile.cleaning{background:rgba(23,162,184,.1);border-color:rgba(23,162,184,.3)}
.rnum{font-size:18px;font-weight:700}
.rtype{font-size:9px;color:var(--text2);margin-top:2px;text-transform:uppercase}
.rdot{width:8px;height:8px;border-radius:50%;margin:5px auto 0}
.rdot.ready{background:#28a745}.rdot.occupied{background:#dc3545}.rdot.dirty{background:#e0a800}.rdot.cleaning{background:#17a2b8}
/* right panel */
.rp{display:flex;flex-direction:column;gap:14px}
/* arrivals / departures */
.arr-list{max-height:230px;overflow-y:auto}
.aitem{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:.15s}
.aitem:hover{background:var(--row-hover)}
.aitem:last-child{border-bottom:none}
.avt{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1a3c34);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.ainf{flex:1;min-width:0}
.aname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ameta{font-size:11px;color:var(--text2);margin-top:1px}
.ci-btn{padding:6px 12px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0}
.co-btn{padding:6px 12px;background:#dc3545;color:#fff;border:none;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0}
/* modals */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.mhdr{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card)}
.mhdr h3{font-size:16px;font-weight:700}
.mbody{padding:20px}
.mfoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.btn-save{background:var(--accent);color:#fff;border:none;padding:10px 22px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.btn-cancel{background:transparent;border:1.5px solid var(--border);color:var(--text2);padding:10px 18px;border-radius:9px;font-size:13px;cursor:pointer}
.btn-danger{background:#dc3545;color:#fff;border:none;padding:10px 22px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
/* status chooser grid */
.schoice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.schoice button{padding:14px;border-radius:10px;border:2px solid var(--border);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--text);transition:.15s}
.schoice button:hover,.schoice button.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
/* detail rows */
.dr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.dr:last-child{border:none}
.dr span:first-child{color:var(--text2)}
.dr span:last-child{font-weight:600}
/* form */
.fg{margin-bottom:12px}
.fg label{display:block;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.fg input,.fg select{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;background:var(--input-bg);color:var(--text);outline:none}
.fg input:focus,.fg select:focus{border-color:var(--accent)}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate-box{background:var(--th-bg);border-radius:9px;padding:11px 13px;font-size:12px;margin-top:10px;display:none}
.rrow{display:flex;justify-content:space-between;padding:2px 0;color:var(--text2)}
.rrow.bold{font-weight:700;font-size:14px;color:var(--text);padding-top:7px;border-top:1px dashed var(--border);margin-top:4px}
</style>
</head>
<body>
<div id="navbar-placeholder"></div>
<script src="ruvia-core.js"></script>
<script src="navbar.js"></script>

<div class="page">
  <div class="page-hdr">
    <h1>🏨 Front Desk</h1>
    <button class="btn-primary" onclick="openQB()">+ Quick Booking</button>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="layout">
    <!-- Room grid -->
    <div class="card">
      <div class="card-hdr">
        <h3>🛏 Room Availability</h3>
        <div class="fstrip">
          <button class="fbtn on" onclick="setFilter('all',this)">All</button>
          <button class="fbtn" onclick="setFilter('ready',this)">🟢 Ready</button>
          <button class="fbtn" onclick="setFilter('occupied',this)">🔴 Occupied</button>
          <button class="fbtn" onclick="setFilter('dirty',this)">🟡 Dirty</button>
          <button class="fbtn" onclick="setFilter('cleaning',this)">🔵 Cleaning</button>
        </div>
      </div>
      <div class="rooms-grid" id="roomsGrid"></div>
    </div>

    <!-- Right panel -->
    <div class="rp">
      <div class="card">
        <div class="card-hdr"><h3>📥 Today's Arrivals</h3><span id="arrCount" style="font-size:12px;color:var(--text2)"></span></div>
        <div class="arr-list" id="arrList"></div>
      </div>
      <div class="card">
        <div class="card-hdr"><h3>📤 Today's Departures</h3><span id="depCount" style="font-size:12px;color:var(--text2)"></span></div>
        <div class="arr-list" id="depList"></div>
      </div>
    </div>
  </div>
</div>

<!-- Room detail modal -->
<div class="overlay" id="roomModal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <div class="mhdr"><h3 id="rmTitle">Room</h3><button onclick="document.getElementById('roomModal').style.display='none'" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2)">✕</button></div>
    <div class="mbody" id="rmBody"></div>
    <div class="mfoot" id="rmFoot"></div>
  </div>
</div>

<!-- Quick Booking modal -->
<div class="overlay" id="qbModal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <div class="mhdr"><h3>⚡ Quick Booking</h3><button onclick="document.getElementById('qbModal').style.display='none'" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2)">✕</button></div>
    <div class="mbody">
      <div class="form-2col">
        <div class="fg"><label>Guest Name</label><input id="qbName" placeholder="Full name"></div>
        <div class="fg"><label>Phone</label><input id="qbPhone" placeholder="+256 ..."></div>
      </div>
      <div class="form-2col">
        <div class="fg"><label>Room</label><select id="qbRoom" onchange="qbRate()"><option value="">Select room...</option></select></div>
        <div class="fg"><label>Adults</label><select id="qbAdults"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
      </div>
      <div class="form-2col">
        <div class="fg"><label>Check-In</label><input type="date" id="qbCI" onchange="qbRate()"></div>
        <div class="fg"><label>Check-Out</label><input type="date" id="qbCO" onchange="qbRate()"></div>
      </div>
      <div class="fg"><label>Payment</label><select id="qbPay"><option value="cash">Cash</option><option value="card">Card</option><option value="mobile">Mobile Money</option></select></div>
      <div class="rate-box" id="qbRateBox"></div>
    </div>
    <div class="mfoot">
      <button class="btn-cancel" onclick="document.getElementById('qbModal').style.display='none'">Cancel</button>
      <button class="btn-save" onclick="doBook()">Confirm Booking</button>
    </div>
  </div>
</div>

<!-- Check-in confirmation modal -->
<div class="overlay" id="ciModal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <div class="mhdr"><h3 id="ciTitle">Check In</h3><button onclick="document.getElementById('ciModal').style.display='none'" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2)">✕</button></div>
    <div class="mbody" id="ciBody"></div>
    <div class="mfoot" id="ciFoot"></div>
  </div>
</div>

<script src="ruvia-store.js"></script>
<script>
const fmt = n => 'USh ' + Math.round(n||0).toLocaleString();
const nights = (a,b) => Math.max(1, Math.round((new Date(b)-new Date(a))/86400000));
let roomFilter = 'all';

// ── data layer ───────────────────────────────────────────
const DB = {
  rooms(){ if(window.RuviaStore) return RuviaStore.getRooms(); try{return JSON.parse(localStorage.getItem('ruvia_rooms')||'[]');}catch(e){return [];} },
  saveRooms(arr){ if(window.RuviaStore){arr.forEach(r=>RuviaStore.updateRoomStatus(r.id,r.status));}else{localStorage.setItem('ruvia_rooms',JSON.stringify(arr));} },
  setRoomStatus(id,status){
    if(window.RuviaStore){ RuviaStore.updateRoomStatus(id,status); return; }
    const arr = DB.rooms().map(r=>r.id===id?{...r,status}:r);
    localStorage.setItem('ruvia_rooms', JSON.stringify(arr));
  },
  reservations(){ if(window.RuviaStore) return RuviaStore.getReservations(); try{return JSON.parse(localStorage.getItem('ruvia_reservations')||'[]');}catch(e){return [];} },
  saveReservation(r){ if(window.RuviaStore){RuviaStore.saveReservation(r);}else{const arr=DB.reservations();arr.unshift(r);localStorage.setItem('ruvia_reservations',JSON.stringify(arr));} },
  updateResStatus(id,status){
    if(window.RuviaStore){RuviaStore.updateReservationStatus(id,status);return;}
    const arr=DB.reservations().map(r=>r.id===id?{...r,status}:r);
    localStorage.setItem('ruvia_reservations',JSON.stringify(arr));
  },
  guests(){ if(window.RuviaStore) return RuviaStore.getGuests(); try{return JSON.parse(localStorage.getItem('ruvia_guests')||'[]');}catch(e){return [];} },
  saveGuest(g){ if(window.RuviaStore){RuviaStore.saveGuest(g);}else{const arr=DB.guests();arr.push(g);localStorage.setItem('ruvia_guests',JSON.stringify(arr));} }
};

// ── seed demo rooms if none ──────────────────────────────
function seedRooms(){
  if(DB.rooms().length) return;
  const types=[['Standard',80000],['Standard',80000],['Standard',80000],['Standard',80000],['Deluxe',120000],['Deluxe',120000],['Deluxe',120000],['Suite',200000],['Suite',200000],['Executive',280000]];
  const statuses=['ready','ready','ready','occupied','dirty','ready','cleaning','ready','occupied','ready'];
  const rooms=types.map(([type,price],i)=>({id:'rm'+(i+1),room_number:String(101+i),room_type:type,base_price:price,status:statuses[i],floor:Math.ceil((i+1)/4)}));
  localStorage.setItem('ruvia_rooms',JSON.stringify(rooms));
}

// ── init ─────────────────────────────────────────────────
function boot(){
  seedRooms();
  setDates();
  populateQbRooms();
  renderAll();
}

function setDates(){
  const today = new Date().toISOString().slice(0,10);
  const tom = new Date(); tom.setDate(tom.getDate()+1);
  document.getElementById('qbCI').value = today;
  document.getElementById('qbCI').min  = today;
  document.getElementById('qbCO').value = tom.toISOString().slice(0,10);
  document.getElementById('qbCO').min  = tom.toISOString().slice(0,10);
}

function renderAll(){
  renderTiles();
  renderRooms();
  renderArrivals();
  renderDepartures();
}

// ── tiles ────────────────────────────────────────────────
function renderTiles(){
  const rooms = DB.rooms();
  const res   = DB.reservations();
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('tiles').innerHTML = [
    {icon:'✅', lbl:'Available',  val:rooms.filter(r=>r.status==='ready').length,    cls:'success'},
    {icon:'🔴', lbl:'Occupied',   val:rooms.filter(r=>r.status==='occupied').length,  cls:'warn'},
    {icon:'📥', lbl:'Arrivals',   val:res.filter(r=>r.status==='confirmed'&&r.check_in<=today).length, cls:'info'},
    {icon:'📤', lbl:'Departures', val:res.filter(r=>r.status==='checked-in'&&r.check_out<=today).length, cls:''},
    {icon:'🛏', lbl:'Total Rooms',val:rooms.length, cls:''},
  ].map(t=>`
    <div class="tile ${t.cls}">
      <div class="tile-icon">${t.icon}</div>
      <div class="tile-val">${t.val}</div>
      <div class="tile-lbl">${t.lbl}</div>
    </div>`).join('');
}

// ── room grid ─────────────────────────────────────────────
function setFilter(f, btn){
  roomFilter = f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderRooms();
}

function renderRooms(){
  const rooms = DB.rooms().filter(r => roomFilter==='all' || r.status===roomFilter);
  const res   = DB.reservations();
  const guests= DB.guests();
  const el    = document.getElementById('roomsGrid');

  if(!rooms.length){
    el.innerHTML='<div style="grid-column:1/-1;padding:24px;text-align:center;color:var(--text2);font-style:italic">No rooms match this filter</div>';
    return;
  }

  el.innerHTML = rooms.map(r=>{
    const curRes  = res.find(x=>x.room_id===r.id && x.status==='checked-in');
    const guest   = curRes ? guests.find(g=>g.id===curRes.guest_id) : null;
    const gname   = guest ? guest.full_name.split(' ')[0] : '';
    return `
      <div class="rtile ${r.status}" onclick="openRoom('${r.id}')">
        <div class="rnum">${r.room_number}</div>
        <div class="rtype">${r.room_type}</div>
        <div class="rdot ${r.status}"></div>
        ${gname?`<div style="font-size:9px;color:var(--text2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${gname}</div>`:''}
      </div>`;
  }).join('');
}

// ── room modal ───────────────────────────────────────────
function openRoom(id){
  const room   = DB.rooms().find(r=>r.id===id);
  if(!room){ alert('Room not found'); return; }
  const res    = DB.reservations();
  const guests = DB.guests();
  const curRes = res.find(x=>x.room_id===id && x.status==='checked-in');
  const guest  = curRes ? guests.find(g=>g.id===curRes.guest_id) : null;
  const ICONS  = {ready:'🟢',occupied:'🔴',dirty:'🟡',cleaning:'🔵'};

  document.getElementById('rmTitle').textContent = `Room ${room.room_number}`;
  document.getElementById('rmBody').innerHTML = `
    <div style="text-align:center;font-size:42px;margin-bottom:12px">${ICONS[room.status]||'🛏'}</div>
    <div class="dr"><span>Room</span><span>${room.room_number} — ${room.room_type}</span></div>
    <div class="dr"><span>Base Rate</span><span>${fmt(room.base_price)}/night</span></div>
    <div class="dr"><span>Floor</span><span>${room.floor||1}</span></div>
    <div class="dr"><span>Status</span><span style="text-transform:capitalize;font-weight:700">${room.status}</span></div>
    ${guest?`
      <div style="margin-top:14px;padding:12px;background:var(--th-bg);border-radius:10px">
        <div style="font-size:10px;font-weight:700;color:var(--text2);margin-bottom:6px">CURRENT GUEST</div>
        <div style="font-size:14px;font-weight:600">${guest.full_name}</div>
        <div style="font-size:12px;color:var(--text2)">${guest.phone||''}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:4px">Check-out: ${curRes.check_out} · Balance: <span style="color:#dc3545">${fmt(curRes.balance||0)}</span></div>
      </div>`:''}
    <div style="margin-top:16px">
      <div style="font-size:10px;font-weight:700;color:var(--text2);margin-bottom:8px">CHANGE STATUS</div>
      <div class="schoice">
        <button class="${room.status==='ready'?'active':''}"    onclick="changeStatus('${id}','ready')">🟢 Ready</button>
        <button class="${room.status==='occupied'?'active':''}" onclick="changeStatus('${id}','occupied')">🔴 Occupied</button>
        <button class="${room.status==='dirty'?'active':''}"    onclick="changeStatus('${id}','dirty')">🟡 Dirty</button>
        <button class="${room.status==='cleaning'?'active':''}" onclick="changeStatus('${id}','cleaning')">🔵 Cleaning</button>
      </div>
    </div>`;

  document.getElementById('rmFoot').innerHTML = `
    ${room.status==='ready' ? `<button class="btn-save" onclick="document.getElementById('roomModal').style.display='none';openQB('${id}')">📅 Book This Room</button>` : ''}
    ${curRes ? `<button class="btn-danger" onclick="doCheckOut('${curRes.id}')">🚪 Check Out</button>` : ''}
    <button class="btn-cancel" onclick="document.getElementById('roomModal').style.display='none'">Close</button>`;

  document.getElementById('roomModal').style.display = 'flex';
}

function changeStatus(roomId, newStatus){
  DB.setRoomStatus(roomId, newStatus);
  logActivity(`Room ${DB.rooms().find(r=>r.id===roomId)?.room_number||roomId} status changed to ${newStatus}`,'housekeeping');
  renderAll();
  // Re-open modal with updated data
  openRoom(roomId);
}

// ── check in / out ───────────────────────────────────────
function openCI(resId){
  const res   = DB.reservations().find(r=>r.id===resId);
  if(!res) return;
  const guest = DB.guests().find(g=>g.id===res.guest_id)||{full_name:'Unknown'};
  const room  = DB.rooms().find(r=>r.id===res.room_id)||{room_number:'?'};
  document.getElementById('ciTitle').textContent = 'Check In — ' + guest.full_name;
  document.getElementById('ciBody').innerHTML = `
    <div class="dr"><span>Guest</span><span>${guest.full_name}</span></div>
    <div class="dr"><span>Phone</span><span>${guest.phone||'—'}</span></div>
    <div class="dr"><span>Room</span><span>Room ${room.room_number} (${room.room_type})</span></div>
    <div class="dr"><span>Check-In</span><span>${res.check_in}</span></div>
    <div class="dr"><span>Check-Out</span><span>${res.check_out}</span></div>
    <div class="dr"><span>Nights</span><span>${res.nights||1}</span></div>
    <div class="dr"><span>Total</span><span style="color:var(--accent)">${fmt(res.total_amount)}</span></div>
    <div class="dr"><span>Balance Due</span><span style="color:#dc3545">${fmt(res.balance||0)}</span></div>
    ${res.special_requests?`<div style="margin-top:12px;padding:10px;background:var(--th-bg);border-radius:9px;font-size:12px;color:var(--text2)"><strong>Requests:</strong> ${res.special_requests}</div>`:''}`;
  document.getElementById('ciFoot').innerHTML = `
    <button class="btn-cancel" onclick="document.getElementById('ciModal').style.display='none'">Cancel</button>
    <button class="btn-save" onclick="doCheckIn('${resId}')">✅ Confirm Check In</button>`;
  document.getElementById('ciModal').style.display = 'flex';
}

function doCheckIn(resId){
  DB.updateResStatus(resId,'checked-in');
  const res = DB.reservations().find(r=>r.id===resId);
  if(res) DB.setRoomStatus(res.room_id,'occupied');
  const g = DB.guests().find(g=>g.id===res?.guest_id)||{};
  logActivity(`${g.full_name||'Guest'} checked in`, 'checkin');
  document.getElementById('ciModal').style.display='none';
  renderAll();
}

function doCheckOut(resId){
  if(!confirm('Confirm check out?')) return;
  DB.updateResStatus(resId,'checked-out');
  const res = DB.reservations().find(r=>r.id===resId);
  if(res) DB.setRoomStatus(res.room_id,'dirty');
  const g = DB.guests().find(g=>g.id===res?.guest_id)||{};
  logActivity(`${g.full_name||'Guest'} checked out`, 'checkout');
  document.getElementById('roomModal').style.display='none';
  renderAll();
}

// ── arrivals / departures lists ──────────────────────────
function renderArrivals(){
  const today = new Date().toISOString().slice(0,10);
  const arr   = DB.reservations().filter(r=>r.status==='confirmed'&&r.check_in<=today);
  const guests= DB.guests();
  const rooms = DB.rooms();
  document.getElementById('arrCount').textContent = arr.length+' guest'+(arr.length!==1?'s':'');
  document.getElementById('arrList').innerHTML = arr.length ? arr.map(r=>{
    const g = guests.find(x=>x.id===r.guest_id)||{full_name:'Guest'};
    const rm= rooms.find(x=>x.id===r.room_id)||{room_number:'?'};
    const ini = g.full_name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
    return `
      <div class="aitem" onclick="openCI('${r.id}')">
        <div class="avt">${ini}</div>
        <div class="ainf">
          <div class="aname">${g.full_name}</div>
          <div class="ameta">Room ${rm.room_number} · ${r.nights||1} night(s) · ${fmt(r.total_amount)}</div>
        </div>
        <button class="ci-btn" onclick="event.stopPropagation();doCheckIn('${r.id}')">Check In</button>
      </div>`;
  }).join('') : '<div style="padding:18px;text-align:center;color:var(--text2);font-size:12px;font-style:italic">No arrivals today</div>';
}

function renderDepartures(){
  const today = new Date().toISOString().slice(0,10);
  const dep   = DB.reservations().filter(r=>r.status==='checked-in'&&r.check_out<=today);
  const guests= DB.guests();
  const rooms = DB.rooms();
  document.getElementById('depCount').textContent = dep.length+' guest'+(dep.length!==1?'s':'');
  document.getElementById('depList').innerHTML = dep.length ? dep.map(r=>{
    const g = guests.find(x=>x.id===r.guest_id)||{full_name:'Guest'};
    const rm= rooms.find(x=>x.id===r.room_id)||{room_number:'?'};
    const ini = g.full_name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
    return `
      <div class="aitem">
        <div class="avt" style="background:linear-gradient(135deg,#dc3545,#8b1a24)">${ini}</div>
        <div class="ainf">
          <div class="aname">${g.full_name}</div>
          <div class="ameta">Room ${rm.room_number} · Balance: <span style="color:${(r.balance||0)>0?'#dc3545':'#28a745'}">${fmt(r.balance||0)}</span></div>
        </div>
        <button class="co-btn" onclick="doCheckOut('${r.id}')">Check Out</button>
      </div>`;
  }).join('') : '<div style="padding:18px;text-align:center;color:var(--text2);font-size:12px;font-style:italic">No departures today</div>';
}

// ── quick booking ────────────────────────────────────────
function populateQbRooms(preId){
  const avail = DB.rooms().filter(r=>r.status==='ready');
  const sel   = document.getElementById('qbRoom');
  sel.innerHTML = '<option value="">Select available room...</option>' +
    avail.map(r=>`<option value="${r.id}" data-price="${r.base_price||80000}">Room ${r.room_number} — ${r.room_type} · ${fmt(r.base_price)}/night</option>`).join('');
  if(preId) sel.value = preId;
}

function openQB(preRoomId){
  populateQbRooms(preRoomId);
  setDates();
  document.getElementById('qbName').value='';
  document.getElementById('qbPhone').value='';
  document.getElementById('qbRateBox').style.display='none';
  document.getElementById('qbModal').style.display='flex';
  if(preRoomId) qbRate();
}

function qbRate(){
  const sel = document.getElementById('qbRoom');
  const ci  = document.getElementById('qbCI').value;
  const co  = document.getElementById('qbCO').value;
  const box = document.getElementById('qbRateBox');
  if(!sel.value||!ci||!co||new Date(co)<=new Date(ci)){box.style.display='none';return;}
  const price = parseFloat(sel.selectedOptions[0]?.dataset.price)||80000;
  const n = nights(ci,co);
  const sub = price*n, vat=Math.round(sub*0.18), tot=sub+vat;
  box.style.display='block';
  box.innerHTML=`
    <div class="rrow"><span>${n} night(s) × ${fmt(price)}</span><span>${fmt(sub)}</span></div>
    <div class="rrow"><span>VAT 18%</span><span>${fmt(vat)}</span></div>
    <div class="rrow bold"><span>Total</span><span style="color:var(--accent)">${fmt(tot)}</span></div>`;
}

function doBook(){
  const name  = document.getElementById('qbName').value.trim();
  const phone = document.getElementById('qbPhone').value.trim();
  const roomId= document.getElementById('qbRoom').value;
  const ci    = document.getElementById('qbCI').value;
  const co    = document.getElementById('qbCO').value;
  if(!name||!roomId||!ci||!co){ alert('Please fill in guest name, room and dates.'); return; }
  if(new Date(co)<=new Date(ci)){ alert('Check-out must be after check-in.'); return; }

  const room  = DB.rooms().find(r=>r.id===roomId);
  const price = room?.base_price||80000;
  const n     = nights(ci,co);
  const sub   = price*n, vat=Math.round(sub*0.18), tot=sub+vat;

  let guest = DB.guests().find(g=>g.full_name?.toLowerCase()===name.toLowerCase());
  if(!guest){ guest={id:'g'+Date.now(),full_name:name,phone,created_at:new Date().toISOString()}; DB.saveGuest(guest); }

  const num = 'RES-'+Date.now().toString().slice(-6);
  const res = {
    id:'r'+Date.now(), reservation_number:num,
    guest_id:guest.id, room_id:roomId,
    check_in:ci, check_out:co,
    adults:parseInt(document.getElementById('qbAdults').value)||2,
    nights:n, base_price:price,
    subtotal:sub, vat, total_amount:tot,
    paid_amount:0, balance:tot,
    payment_method:document.getElementById('qbPay').value,
    status:'confirmed',
    created_at:new Date().toISOString(),
    created_by:localStorage.getItem('ruviaos_user')||'staff'
  };
  DB.saveReservation(res);
  logActivity(`Booking ${num} for ${name} — Room ${room?.room_number}`, 'booking');
  document.getElementById('qbModal').style.display='none';
  alert(`✅ Booking ${num} confirmed for ${name}!`);
  renderAll();
}

// ── activity log ─────────────────────────────────────────
function logActivity(msg, type){
  const user = localStorage.getItem('ruviaos_user')||'staff';
  try{
    const al=JSON.parse(localStorage.getItem('ruvia_activity_log')||'[]');
    al.unshift({id:Date.now(),type,message:msg,username:user,category:type,time:new Date().toISOString()});
    localStorage.setItem('ruvia_activity_log',JSON.stringify(al.slice(0,500)));
  }catch(e){}
}

if(window.RuviaStore) RuviaStore.onChange(renderAll);
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuviaOS - Front Desk</title>
    <link rel="stylesheet" href="darkmode.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg); padding: 2rem; }
        .header { background: var(--header-gradient); color: white; padding: 2rem; border-radius: var(--radius); margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; box-shadow: var(--shadow-lg); }
        .header h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.025em; }
        .date-time { text-align: right; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
        .stat-card { background: var(--card); padding: 1.5rem; border-radius: var(--radius); text-align: center; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .stat-number { font-size: 2.25rem; font-weight: 800; color: var(--accent); }
        .stat-label { color: var(--text2); margin-top: 0.5rem; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

        .table-container { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 2.5rem; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--th-bg); padding: 1rem; text-align: left; font-weight: 700; border-bottom: 2px solid var(--border); color: var(--text2); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 1rem; border-bottom: 1px solid var(--border); color: var(--text); font-size: 0.875rem; }
        tr:hover { background: var(--row-hover); }
        .empty-row td { text-align:center; color:var(--text2); font-style:italic; padding:3rem; }

        .badge { padding: 0.375rem 0.875rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; display: inline-block; border: 1px solid transparent; }
        .badge-ready { background: rgba(16,185,129,0.1); color: #10b981; border-color: rgba(16,185,129,0.2); }
        .badge-dirty { background: rgba(244,63,94,0.1); color: #f43f5e; border-color: rgba(244,63,94,0.2); }
        .badge-occupied { background: rgba(245,158,11,0.1); color: #f59e0b; border-color: rgba(245,158,11,0.2); }
        .badge-cleaning { background: rgba(14,165,233,0.1); color: #0ea5e9; border-color: rgba(14,165,233,0.2); }

        .btn { padding: 0.625rem 1.25rem; border: none; border-radius: 8px; cursor: pointer; font-size: 0.8125rem; font-weight: 700; transition: all 0.2s; margin: 0.25rem; }
        .btn-checkin { background: #10b981; color: white; }
        .btn-checkin:hover { background: #059669; transform: translateY(-1px); }
        .btn-checkout { background: #ef4444; color: white; }
        .btn-checkout:hover { background: #dc2626; transform: translateY(-1px); }
        .btn-pay { background: var(--accent); color: white; }
        .btn-pay:hover { background: var(--accent2); transform: translateY(-1px); }

        .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.5rem; padding: 1rem; }
        .room-card { background: var(--card); border-radius: var(--radius); padding: 1.5rem; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--border); transition: all 0.3s; }
        .room-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--accent); }

        .tabs { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .tab { padding: 0.75rem 1.5rem; background: var(--card); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 0.9375rem; font-weight: 600; transition: all 0.2s; color: var(--text2); }
        .tab:hover { background: var(--th-bg); color: var(--text); }
        .tab.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: var(--shadow); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .toast { position:fixed; bottom:2rem; right:2rem; background:var(--accent); color:white; padding:1rem 1.5rem; border-radius:10px; font-size:0.875rem; font-weight:600; opacity:0; transform:translateY(20px); transition:all 0.3s; z-index:9999; pointer-events:none; box-shadow: var(--shadow-lg); }
        .toast.show { opacity:1; transform:translateY(0); }
    </style>
</head>
<body>
<div id="navbar-placeholder"></div>
<script src="navbar.js"></script>
<script src="ruvia-store.js"></script>
<script src="darkmode.js"></script>

<div class="header">
    <h1>🏨 Front Desk Operations</h1>
    <div class="date-time">
        <div style="font-size:1.125rem;font-weight:700" id="currentDate"></div>
        <div style="font-size:0.875rem;opacity:.9" id="currentTime"></div>
    </div>
</div>

<div class="stats">
    <div class="stat-card"><div class="stat-number" id="statTotal">-</div><div class="stat-label">Total Rooms</div></div>
    <div class="stat-card"><div class="stat-number" id="statAvailable" style="color:#10b981">-</div><div class="stat-label">Available</div></div>
    <div class="stat-card"><div class="stat-number" id="statOccupied" style="color:#f59e0b">-</div><div class="stat-label">Occupied</div></div>
    <div class="stat-card"><div class="stat-number" id="statDirty" style="color:#f43f5e">-</div><div class="stat-label">Dirty/Cleaning</div></div>
    <div class="stat-card"><div class="stat-number" id="statArrivals">-</div><div class="stat-label">Arrivals Today</div></div>
    <div class="stat-card"><div class="stat-number" id="statDepartures">-</div><div class="stat-label">Departures Today</div></div>
</div>

<div class="tabs">
    <button class="tab active" onclick="showTab('arrivals',this)">📥 Arrivals</button>
    <button class="tab" onclick="showTab('departures',this)">📤 Departures</button>
    <button class="tab" onclick="showTab('rooms',this)">🛏️ Room Status</button>
</div>

<div id="tab-arrivals" class="tab-content active">
    <div class="table-container">
        <table><thead><tr><th>Guest</th><th>Res #</th><th>Room</th><th>Type</th><th>Nights</th><th>Total</th><th>Paid</th><th>Action</th></tr></thead>
        <tbody id="arrivalsBody"></tbody></table>
    </div>
</div>
<div id="tab-departures" class="tab-content">
    <div class="table-container">
        <table><thead><tr><th>Guest</th><th>Res #</th><th>Room</th><th>Balance</th><th>Actions</th></tr></thead>
        <tbody id="departuresBody"></tbody></table>
    </div>
</div>
<div id="tab-rooms" class="tab-content">
    <div class="room-grid" id="roomGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
function updateDateTime(){const n=new Date();document.getElementById('currentDate').textContent=n.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});document.getElementById('currentTime').textContent=n.toLocaleTimeString();}
updateDateTime();setInterval(updateDateTime,1000);
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function fmt(n){return'UGX '+Math.round(n||0).toLocaleString();}
function nights(ci,co){return Math.max(1,Math.round((new Date(co)-new Date(ci))/86400000));}
function showTab(name,btn){document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+name).classList.add('active');btn.classList.add('active');}

function loadAll(){
    const rooms=RuviaStore.getRooms(),guests=RuviaStore.getGuests(),reservations=RuviaStore.getReservations();
    const today=new Date().toISOString().slice(0,10);
    document.getElementById('statTotal').textContent=rooms.length;
    document.getElementById('statAvailable').textContent=rooms.filter(r=>r.status==='ready').length;
    document.getElementById('statOccupied').textContent=rooms.filter(r=>r.status==='occupied').length;
    document.getElementById('statDirty').textContent=rooms.filter(r=>r.status==='dirty'||r.status==='cleaning').length;
    const arrivals=reservations.filter(r=>r.status==='confirmed'&&r.check_in<=today);
    document.getElementById('statArrivals').textContent=arrivals.length;
    const ab=document.getElementById('arrivalsBody');
    ab.innerHTML=arrivals.length===0?'<tr class="empty-row"><td colspan="8">No arrivals today</td></tr>':
        arrivals.map(res=>{const g=guests.find(x=>x.id===res.guest_id)||{};const rm=rooms.find(x=>x.id===res.room_id)||{};
        return`<tr><td><strong>${g.full_name||'Unknown'}</strong></td><td>${res.reservation_number}</td><td>${rm.room_number||'-'}</td><td>${rm.room_type||'-'}</td><td>${nights(res.check_in,res.check_out)}n</td><td>${fmt(res.total_amount)}</td><td>${fmt(res.paid_amount)}</td><td><button class="btn btn-checkin" onclick="doCheckIn(${res.id})">Check In</button></td></tr>`;}).join('');
    const departures=reservations.filter(r=>r.status==='checked-in'&&r.check_out<=today);
    document.getElementById('statDepartures').textContent=departures.length;
    const db=document.getElementById('departuresBody');
    db.innerHTML=departures.length===0?'<tr class="empty-row"><td colspan="5">No departures today</td></tr>':
        departures.map(res=>{const g=guests.find(x=>x.id===res.guest_id)||{};const rm=rooms.find(x=>x.id===res.room_id)||{};
        return`<tr><td><strong>${g.full_name||'Unknown'}</strong></td><td>${res.reservation_number}</td><td>${rm.room_number||'-'}</td><td>${res.balance>0?'<strong style="color:#ef4444;">'+fmt(res.balance)+'</strong>':'<span style="color:#10b981;font-weight:700">✓ Cleared</span>'}</td><td>${res.balance>0?`<button class="btn btn-pay" onclick="doPayment(${res.id},${res.balance})">Collect</button>`:''}<button class="btn btn-checkout" onclick="doCheckOut(${res.id})">Check Out</button></td></tr>`;}).join('');
    const statusMap={ready:'badge-ready',occupied:'badge-occupied',dirty:'badge-dirty',cleaning:'badge-cleaning'};
    const labelMap={ready:'🟢 Ready',occupied:'🔴 Occupied',dirty:'🟡 Dirty',cleaning:'🔵 Cleaning'};
    document.getElementById('roomGrid').innerHTML=rooms.map(r=>`<div class="room-card"><div style="font-size:1.5rem;font-weight:800;color:var(--text)">${r.room_number}</div><div style="font-size:0.75rem;color:var(--text2);margin-top:0.25rem">${r.room_type}</div><div style="font-size:0.8125rem;color:var(--accent);font-weight:700;margin-top:0.5rem">UGX ${(r.base_price||0).toLocaleString()}</div><div style="margin-top:0.75rem"><span class="badge ${statusMap[r.status]||''}">${labelMap[r.status]||r.status}</span></div></div>`).join('');
}
function doCheckIn(id){if(!confirm('Confirm check-in?'))return;RuviaStore.checkIn(id);showToast('✅ Checked in! Room marked Occupied.');loadAll();}
function doCheckOut(id){const res=RuviaStore.getReservations().find(r=>r.id===id);if(res&&res.balance>0){if(!confirm('Balance of UGX '+res.balance.toLocaleString()+' outstanding. Check out anyway?'))return;}else if(!confirm('Confirm check-out?'))return;RuviaStore.checkOut(id);showToast('👋 Checked out! Room queued for housekeeping.');loadAll();}
function doPayment(id,bal){const a=prompt('Payment amount (balance: UGX '+bal.toLocaleString()+'):');if(!a)return;const n=parseInt(a.replace(/[^0-9]/g,''));if(!n||n<=0)return;RuviaStore.recordPayment(id,Math.min(n,bal));showToast('💳 Payment recorded!');loadAll();}
RuviaStore.onChange(()=>loadAll());
loadAll();
</script>
</body>
</html>

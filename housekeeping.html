<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RuviaOS – Housekeeping</title>
<link rel="stylesheet" href="darkmode.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Segoe UI',sans-serif;padding:2rem}
.container{max-width:1400px;margin:0 auto}
.header{background:var(--header-gradient);color:#fff;padding:2rem;border-radius:var(--radius);margin-bottom:2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;box-shadow:var(--shadow-lg)}
.header h1{font-size:1.5rem;font-weight:800;letter-spacing:-0.025em}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1.5rem;margin-bottom:2rem}
.stat-card{background:var(--card);padding:1.5rem;border-radius:var(--radius);text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:all 0.2s;border:1px solid var(--border)}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.stat-value{font-size:1.875rem;font-weight:800}
.stat-label{color:var(--text2);margin-top:0.5rem;font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em}
.stat-card.ready .stat-value{color:#10b981}
.stat-card.dirty .stat-value{color:#ef4444}
.stat-card.occupied .stat-value{color:#f59e0b}
.stat-card.cleaning .stat-value{color:#0ea5e9}
.filters{display:flex;gap:0.75rem;margin-bottom:1.5rem;flex-wrap:wrap}
.filter-btn{padding:0.625rem 1.25rem;background:var(--card);border:1px solid var(--border);border-radius:9999px;cursor:pointer;font-size:0.8125rem;font-weight:700;transition:all 0.2s;box-shadow:var(--shadow);color:var(--text2)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1.5rem;margin-bottom:2.5rem}
.room-card{background:var(--card);border-radius:var(--radius);padding:1.5rem;text-align:center;cursor:pointer;transition:all 0.3s;box-shadow:var(--shadow);border:1px solid var(--border);border-left-width:5px !important}
.room-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.room-card.ready{border-left-color:#10b981 !important}
.room-card.dirty{border-left-color:#ef4444 !important}
.room-card.occupied{border-left-color:#f59e0b !important}
.room-card.cleaning{border-left-color:#0ea5e9 !important}
.room-number{font-size:1.75rem;font-weight:800;color:var(--text)}
.room-type{font-size:0.75rem;color:var(--text2);margin:0.25rem 0}
.room-status-badge{display:inline-block;padding:0.25rem 0.75rem;border-radius:9999px;font-size:0.6875rem;font-weight:700;margin:0.5rem 0;text-transform:uppercase;letter-spacing:0.05em}
.bs-ready{background:#10b981;color:#fff}
.bs-dirty{background:#ef4444;color:#fff}
.bs-occupied{background:#f59e0b;color:#fff}
.bs-cleaning{background:#0ea5e9;color:#fff}
.assigned-info{font-size:0.6875rem;color:var(--text2);margin-top:0.75rem;padding:0.375rem 0.75rem;background:var(--th-bg);border-radius:8px;font-weight:600}
.section-title{font-size:1.125rem;font-weight:800;margin-bottom:1.25rem;padding-bottom:0.75rem;border-bottom:2px solid var(--accent);display:inline-block;color:var(--text);letter-spacing:-0.01em}
.table-container{background:var(--card);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th,td{padding:1rem;text-align:left;border-bottom:1px solid var(--border);font-size:0.8125rem}
th{background:var(--th-bg);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;font-size:0.75rem}
tr:hover{background:var(--row-hover)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.75);backdrop-filter:blur(4px);justify-content:center;align-items:center;z-index:1000}
.modal-content{background:var(--card);padding:2.5rem;border-radius:var(--radius);max-width:480px;width:92%;color:var(--text);box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.modal-content h3{margin-bottom:1.5rem;color:var(--accent);font-weight:800;font-size:1.5rem;letter-spacing:-0.025em}
.status-options{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin:1.5rem 0}
.status-option{padding:1rem;border:2px solid var(--border);border-radius:12px;text-align:center;cursor:pointer;background:var(--card);font-weight:700;font-size:0.875rem;color:var(--text);transition:all 0.2s}
.status-option:hover{transform:scale(1.02);border-color:var(--accent)}
.status-option.selected{border-color:var(--accent);background:rgba(79,70,229,0.1);color:var(--accent)}
.form-group{margin-bottom:1.25rem}
.form-group label{display:block;font-weight:700;margin-bottom:0.5rem;font-size:0.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:0.75rem;border:1px solid var(--border);border-radius:8px;font-size:0.875rem;background:var(--input-bg);color:var(--text);transition:all 0.2s}
.btn{padding:0.75rem 1.25rem;border:none;border-radius:8px;cursor:pointer;font-weight:700;margin:0.25rem;transition:all 0.2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-danger{background:#ef4444;color:#fff}
.toast{position:fixed;bottom:2rem;right:2rem;padding:1rem 1.5rem;border-radius:10px;display:none;z-index:9999;font-size:0.875rem;font-weight:700;color:#fff;box-shadow:var(--shadow-lg)}
.toast.success{background:#10b981}.toast.error{background:#ef4444}
@media(max-width:768px){.room-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
</style>
</head>
<body>
<div id="navbar-placeholder"></div>
<script src="navbar.js"></script>
<script src="darkmode.js"></script>
<script src="ruvia-store.js"></script>

<div class="container">
<div class="header">
  <h1>🧹 Housekeeping Management</h1>
  <button style="background:rgba(255,255,255,0.2);color:#fff;border:none;padding:0.625rem 1.25rem;border-radius:8px;cursor:pointer;font-weight:700;font-size:0.875rem" onclick="loadAll()">Refresh</button>
</div>

<div class="stats-grid">
  <div class="stat-card ready" onclick="filterBy('ready')"><div class="stat-value" id="readyCount">-</div><div class="stat-label">Ready</div></div>
  <div class="stat-card dirty" onclick="filterBy('dirty')"><div class="stat-value" id="dirtyCount">-</div><div class="stat-label">Dirty</div></div>
  <div class="stat-card occupied" onclick="filterBy('occupied')"><div class="stat-value" id="occupiedCount">-</div><div class="stat-label">Occupied</div></div>
  <div class="stat-card cleaning" onclick="filterBy('cleaning')"><div class="stat-value" id="cleaningCount">-</div><div class="stat-label">Cleaning</div></div>
  <div class="stat-card" onclick="filterBy('all')"><div class="stat-value" id="totalCount">-</div><div class="stat-label">All Rooms</div></div>
</div>

<div class="filters">
  <button class="filter-btn active" id="fb-all" onclick="filterBy('all')">All Rooms</button>
  <button class="filter-btn" id="fb-ready" onclick="filterBy('ready')">🟢 Ready</button>
  <button class="filter-btn" id="fb-dirty" onclick="filterBy('dirty')">🔴 Dirty</button>
  <button class="filter-btn" id="fb-occupied" onclick="filterBy('occupied')">👤 Occupied</button>
  <button class="filter-btn" id="fb-cleaning" onclick="filterBy('cleaning')">🧹 Cleaning</button>
</div>

<div class="room-grid" id="roomGrid"></div>

<h3 class="section-title">Recent Activity</h3>
<div class="table-container"><table>
  <thead><tr><th>Room</th><th>Action</th><th>From</th><th>To</th><th>Assigned</th><th>Time</th></tr></thead>
  <tbody id="activityBody"></tbody>
</table></div>
</div>

<!-- Status Modal -->
<div id="statusModal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Room Status</h3>
    <div class="status-options">
      <div class="status-option" onclick="pickStatus('ready',this)">🟢 Ready</div>
      <div class="status-option" onclick="pickStatus('dirty',this)">🔴 Dirty</div>
      <div class="status-option" onclick="pickStatus('occupied',this)">👤 Occupied</div>
      <div class="status-option" onclick="pickStatus('cleaning',this)">🧹 Cleaning</div>
    </div>
    <div class="form-group"><label>Assign Housekeeper</label>
      <input id="hkName" placeholder="Housekeeper name (optional)"></div>
    <div class="form-group"><label>Notes</label>
      <textarea id="hkNotes" rows="2" placeholder="Any notes..."></textarea></div>
    <div style="display:flex;gap:0.75rem;margin-top:1.5rem">
      <button class="btn btn-primary" style="flex:1" onclick="applyStatus()">Update</button>
      <button class="btn btn-danger" style="flex:1" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let currentFilter='all', pendingRoomId=null, pendingStatus=null;

function toast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
function closeModal(){document.getElementById('statusModal').style.display='none';}
window.onclick=e=>{if(e.target===document.getElementById('statusModal'))closeModal();}

function filterBy(f){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  const fb=document.getElementById('fb-'+f);if(fb)fb.classList.add('active');
  renderRooms(RuviaStore.getRooms());
}

function loadAll(){
  const rooms=RuviaStore.getRooms(),log=RuviaStore.getHousekeepingLog();
  document.getElementById('readyCount').textContent=rooms.filter(r=>r.status==='ready').length;
  document.getElementById('dirtyCount').textContent=rooms.filter(r=>r.status==='dirty').length;
  document.getElementById('occupiedCount').textContent=rooms.filter(r=>r.status==='occupied').length;
  document.getElementById('cleaningCount').textContent=rooms.filter(r=>r.status==='cleaning').length;
  document.getElementById('totalCount').textContent=rooms.length;
  renderRooms(rooms); renderLog(log);
}

function renderRooms(rooms){
  const list=currentFilter==='all'?rooms:rooms.filter(r=>r.status===currentFilter);
  const bmap={ready:'bs-ready',dirty:'bs-dirty',occupied:'bs-occupied',cleaning:'bs-cleaning'};
  const lmap={ready:'🟢 Ready',dirty:'🔴 Dirty',occupied:'👤 Occupied',cleaning:'🧹 Cleaning'};
  document.getElementById('roomGrid').innerHTML=list.length===0
    ?`<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text2)">No rooms in this category</div>`
    :list.map(r=>`<div class="room-card ${r.status}" onclick="openModal(${r.id},'${r.room_number}','${r.status}')">
        <div class="room-number">${r.room_number}</div>
        <div class="room-type">${r.room_type}</div>
        <div><span class="room-status-badge ${bmap[r.status]||''}">${lmap[r.status]||r.status}</span></div>
        ${r.assigned_housekeeper?`<div class="assigned-info">🧹 ${r.assigned_housekeeper}</div>`:''}
      </div>`).join('');
}

function renderLog(log){
  document.getElementById('activityBody').innerHTML=log.length===0
    ?`<tr><td colspan="6" style="text-align:center;color:var(--text2);padding:20px">No activity yet</td></tr>`
    :log.slice(0,30).map(e=>`<tr>
        <td><strong>${e.room}</strong></td><td>${e.action}</td>
        <td>${e.old_status||'-'}</td><td>${e.new_status||'-'}</td>
        <td>${e.assigned_to||'-'}</td><td>${e.time||'-'}</td>
      </tr>`).join('');
}

function openModal(id,num,status){
  pendingRoomId=id;pendingStatus=null;
  document.getElementById('modalTitle').textContent=`Room ${num} Status`;
  document.getElementById('hkName').value='';document.getElementById('hkNotes').value='';
  document.querySelectorAll('.status-option').forEach(o=>o.classList.remove('selected'));
  document.getElementById('statusModal').style.display='flex';
}
function pickStatus(s,el){pendingStatus=s;document.querySelectorAll('.status-option').forEach(o=>o.classList.remove('selected'));el.classList.add('selected');}
function applyStatus(){
  if(!pendingStatus){toast('Pick a status','error');return;}
  const hk=document.getElementById('hkName').value.trim()||null;
  RuviaStore.updateRoomStatus(pendingRoomId,pendingStatus,hk);
  toast('✅ Room status updated');closeModal();loadAll();
}

RuviaStore.onChange(()=>loadAll());
loadAll();
</script>
</body>
</html>

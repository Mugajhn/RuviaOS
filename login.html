<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RuviaOS – Login</title>
<link rel="stylesheet" href="darkmode.css">
<script src="darkmode.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Segoe UI',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;background:var(--header-gradient);padding:2rem}
.card{background:var(--card);padding:3rem;border-radius:var(--radius);box-shadow:var(--shadow-lg);width:100%;max-width:440px;text-align:center;border:1px solid rgba(255,255,255,0.1)}
.logo{font-size:4rem;margin-bottom:1.5rem;display:block}
h1{color:var(--accent);font-size:2rem;margin-bottom:0.5rem;font-weight:800;letter-spacing:-0.05em}
h2{color:var(--text2);font-size:1rem;font-weight:500;margin-bottom:2.5rem}
.form-group{margin-bottom:1.5rem;text-align:left}
.form-group label{display:block;font-size:0.75rem;font-weight:700;color:var(--text2);margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.05em}
.form-group input{width:100%;padding:0.875rem 1rem;border:1px solid var(--border);border-radius:8px;font-size:1rem;background:var(--input-bg);color:var(--text);transition:all 0.2s;outline:none}
.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,0.1)}
.btn-login{width:100%;padding:1rem;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:0.5rem;transition:all 0.2s}
.btn-login:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:var(--shadow)}
.error{color:#ef4444;font-size:0.875rem;margin-top:1.25rem;display:none;padding:0.75rem 1rem;background:rgba(239,68,68,0.1);border-radius:8px;border:1px solid rgba(239,68,68,0.2);font-weight:500}
.demo{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--border);font-size:0.8125rem;color:var(--text2);line-height:1.6}
.demo strong{color:var(--text);font-weight:600}
</style>
</head>
<body>
<div class="card">
  <span class="logo">🏨</span>
  <h1>RuviaOS</h1>
  <h2>Employee Access Portal</h2>
  <div class="form-group"><label>Username</label><input type="text" id="username" placeholder="e.g. admin" autocomplete="off"></div>
  <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
  <button class="btn-login" onclick="doLogin()">🔐 Login to System</button>
  <div class="error" id="err"></div>
  <div class="demo">
    <strong>Demo Credentials</strong><br>
    Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>admin123</strong><br>
    Manager · Reception · Kitchen · Housekeeping
  </div>
</div>
<script src="ruvia-store.js"></script>
<script>
const USERS={admin:'admin123',manager:'admin123',reception:'admin123',kitchen:'admin123',housekeeping:'admin123'};
function doLogin(){
  const u=document.getElementById('username').value.trim().toLowerCase();
  const p=document.getElementById('password').value;
  const err=document.getElementById('err');
  if(USERS[u]&&USERS[u]===p){
    localStorage.setItem('ruviaos_logged_in','true');
    localStorage.setItem('ruviaos_user',u);
    localStorage.setItem('ruviaos_role',u);
    window.location.href='index.html';
  } else {
    err.textContent='❌ Invalid username or password. Use admin / admin123';
    err.style.display='block';
  }
}
if(localStorage.getItem('ruviaos_logged_in')==='true') window.location.href='index.html';
</script>
</body>
</html>

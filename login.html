<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RuviaOS — Login</title>
<script src="ruvia-core.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#0f2518 0%,#1a3c34 50%,#0f2518 100%);display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh}
.login-wrap{display:flex;gap:0;border-radius:20px;overflow:hidden;max-width:820px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.4)}
.login-brand{background:linear-gradient(160deg,#2c5f4a,#1a3c34);padding:48px 36px;display:flex;flex-direction:column;justify-content:space-between;min-width:300px;position:relative;overflow:hidden}
.login-brand::before{content:'';position:absolute;top:-60px;right:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.04)}
.login-brand::after{content:'';position:absolute;bottom:-40px;left:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.03)}
.brand-top{}
.brand-logo{font-size:48px;margin-bottom:16px}
.brand-name{font-size:26px;font-weight:700;color:#fff;margin-bottom:6px}
.brand-sub{font-size:13px;color:rgba(255,255,255,.6);line-height:1.5}
.brand-stats{display:flex;flex-direction:column;gap:10px}
.bstat{display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,.55)}
.bstat-dot{width:6px;height:6px;border-radius:50%;background:#4caf87;flex-shrink:0}
.login-form-wrap{background:#fff;padding:40px 36px;flex:1}
body.dark-mode .login-form-wrap{background:#1c2030}
.form-title{font-size:22px;font-weight:600;color:#1a3c34;margin-bottom:4px}
body.dark-mode .form-title{color:#e2e4ea}
.form-sub{font-size:13px;color:#666;margin-bottom:28px}
body.dark-mode .form-sub{color:#9a9da8}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
body.dark-mode .form-group label{color:#9a9da8}
.form-group input,.form-group select{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;background:#fff;color:#222}
body.dark-mode .form-group input,body.dark-mode .form-group select{background:#252535;border-color:rgba(255,255,255,.12);color:#e2e4ea}
.form-group input:focus,.form-group select:focus{border-color:#2c5f4a;box-shadow:0 0 0 3px rgba(44,95,74,.12)}
.btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#2c5f4a,#1a3c34);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:16px}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(44,95,74,.35)}
.btn-login:active{transform:translateY(0)}
.error-msg{background:#fdecea;color:#c0392b;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;border-left:3px solid #e74c3c}
body.dark-mode .error-msg{background:#3a1818;color:#f09090}
.demo-box{background:#f8f9fa;border-radius:10px;padding:14px;margin-top:8px}
body.dark-mode .demo-box{background:#252535}
.demo-title{font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
body.dark-mode .demo-title{color:#9a9da8}
.demo-accounts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.demo-btn{padding:8px 10px;background:#fff;border:1px solid #e0e0e0;border-radius:7px;cursor:pointer;font-size:11px;color:#444;transition:all .15s;text-align:left}
body.dark-mode .demo-btn{background:#1c2030;border-color:rgba(255,255,255,.1);color:#e2e4ea}
.demo-btn:hover{border-color:#2c5f4a;color:#2c5f4a}
.demo-btn .d-role{color:#999;font-size:10px}
body.dark-mode .demo-btn .d-role{color:#9a9da8}
@media(max-width:600px){.login-wrap{flex-direction:column}.login-brand{min-width:auto;padding:28px 24px}.login-form-wrap{padding:28px 24px}}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-brand">
    <div class="brand-top">
      <div class="brand-logo">🏨</div>
      <div class="brand-name">Ruvia Hotel</div>
      <div class="brand-sub">Property Management System<br>Powered by RuviaOS</div>
    </div>
    <div class="brand-stats">
      <div class="bstat"><span class="bstat-dot"></span>Reservations & PMS</div>
      <div class="bstat"><span class="bstat-dot"></span>Restaurant POS</div>
      <div class="bstat"><span class="bstat-dot"></span>Housekeeping</div>
      <div class="bstat"><span class="bstat-dot"></span>Stock & Reports</div>
      <div class="bstat"><span class="bstat-dot"></span>Staff Management</div>
    </div>
  </div>
  <div class="login-form-wrap">
    <h1 class="form-title">Welcome back</h1>
    <p class="form-sub">Sign in to your account to continue</p>
    <div class="error-msg" id="errMsg"></div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="e.g. admin" autocomplete="off" autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-login" onclick="doLogin()">🔐 Sign In</button>
    <div class="demo-box">
      <div class="demo-title">Demo Accounts — click to fill</div>
      <div class="demo-accounts">
        <button class="demo-btn" onclick="fill('admin','admin123')"><strong>admin</strong><div class="d-role">Administrator</div></button>
        <button class="demo-btn" onclick="fill('manager','admin123')"><strong>manager</strong><div class="d-role">Manager</div></button>
        <button class="demo-btn" onclick="fill('reception','admin123')"><strong>reception</strong><div class="d-role">Receptionist</div></button>
        <button class="demo-btn" onclick="fill('kitchen','admin123')"><strong>kitchen</strong><div class="d-role">Kitchen Staff</div></button>
        <button class="demo-btn" onclick="fill('housekeeping','admin123')"><strong>housekeeping</strong><div class="d-role">Housekeeping</div></button>
      </div>
    </div>
  </div>
</div>

<script>
const USERS = {
  admin:       { password:'admin123', role:'admin' },
  manager:     { password:'admin123', role:'manager' },
  reception:   { password:'admin123', role:'reception' },
  kitchen:     { password:'admin123', role:'kitchen' },
  housekeeping:{ password:'admin123', role:'housekeeping' }
};

function fill(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
}

function doLogin() {
  const u = document.getElementById('username').value.trim().toLowerCase();
  const p = document.getElementById('password').value;
  const err = document.getElementById('errMsg');
  err.style.display = 'none';
  if (!USERS[u] || USERS[u].password !== p) {
    err.textContent = '❌ Invalid username or password.';
    err.style.display = 'block';
    return;
  }
  // Use RuviaAuth if available, else fallback
  if (window.RuviaAuth) {
    RuviaAuth.login(u, USERS[u].role);
  } else {
    localStorage.setItem('ruviaos_logged_in','true');
    localStorage.setItem('ruviaos_user', u);
    localStorage.setItem('ruviaos_role', USERS[u].role);
  }
  window.location.href = 'index.html';
}

// Redirect if already logged in
if (localStorage.getItem('ruviaos_logged_in') === 'true') {
  window.location.href = 'index.html';
}
</script>
</body>
</html>

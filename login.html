<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuviaOS - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a3c34, #2c5f4a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-container h1 {
            color: #2c5f4a;
            margin-bottom: 10px;
        }
        .login-container h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .login-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #2c5f4a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #1a3c34;
        }
        .error {
            color: #dc3545;
            margin-top: 10px;
            display: none;
        }
        .demo-info {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-icon">🏨</div>
        <h1>RuviaOS</h1>
        <h2>Employee Login</h2>
        <input type="text" id="username" placeholder="Username" autocomplete="off">
        <input type="password" id="password" placeholder="Password">
        <button onclick="doLogin()">🔐 Login</button>
        <div id="errorMsg" class="error"></div>
        <div class="demo-info">
            <strong>Demo Credentials:</strong><br>
            Username: <strong>admin</strong> | Password: <strong>admin123</strong><br>
            (or any: manager, reception, kitchen, housekeeping)
        </div>
    </div>

    <script>
        function doLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            
            const validUsers = ['admin', 'manager', 'reception', 'kitchen', 'housekeeping'];
            
            if (username && password === 'admin123' && validUsers.includes(username.toLowerCase())) {
                // Save login info to localStorage
                localStorage.setItem('ruviaos_logged_in', 'true');
                localStorage.setItem('ruviaos_user', username);
                localStorage.setItem('ruviaos_role', username);
                
                // Redirect to home page
                window.location.href = '/index.html';
            } else {
                errorDiv.innerHTML = '❌ Invalid username or password. Try admin / admin123';
                errorDiv.style.display = 'block';
            }
        }
        
        // Press Enter to login
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>

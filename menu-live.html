<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruvia Hotel — Menu</title>
<meta name="description" content="View our full restaurant menu with fresh prices and availability">
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#faf9f6;
  --card:#fff;
  --text:#1a1a2e;
  --text2:#6b7280;
  --border:#e8e3d9;
  --accent:#2c5f4a;
  --accent-light:#e8f5f0;
  --gold:#b8955a;
  --gold-light:#fdf6ec;
  --shadow:0 2px 12px rgba(0,0,0,.07);
  --shadow-md:0 6px 24px rgba(0,0,0,.10);
}

body{
  font-family:'Georgia',serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* ── Hero header ── */
.hero{
  background:linear-gradient(160deg,#1a3c34 0%,#2c5f4a 55%,#3d7a5e 100%);
  color:#fff;
  padding:36px 20px 28px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.hero::before{
  content:'';
  position:absolute;
  inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}

.hero-inner{position:relative;z-index:1}

.hotel-badge{
  display:inline-block;
  font-size:10px;
  font-family:'Segoe UI',system-ui,sans-serif;
  font-weight:700;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:rgba(255,255,255,.6);
  margin-bottom:10px;
}

.hero h1{
  font-size:32px;
  font-weight:400;
  letter-spacing:.02em;
  margin-bottom:4px;
}

.hero h1 span{color:#a8d5c0}

.hero-sub{
  font-size:13px;
  font-family:'Segoe UI',system-ui,sans-serif;
  color:rgba(255,255,255,.65);
  margin-bottom:16px;
}

.live-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;
  padding:5px 14px;
  font-size:11px;
  font-family:'Segoe UI',system-ui,sans-serif;
  font-weight:600;
  color:rgba(255,255,255,.85);
}

.live-dot{
  width:7px;height:7px;
  border-radius:50%;
  background:#4ade80;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.6;transform:scale(1.3)}
}

/* ── Sticky category nav ── */
.cat-nav{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:0 16px;
  display:flex;
  gap:0;
  overflow-x:auto;
  scrollbar-width:none;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.cat-nav::-webkit-scrollbar{display:none}

.cat-tab{
  flex-shrink:0;
  padding:14px 16px;
  font-family:'Segoe UI',system-ui,sans-serif;
  font-size:12px;
  font-weight:600;
  color:var(--text2);
  border:none;
  background:transparent;
  cursor:pointer;
  border-bottom:2.5px solid transparent;
  transition:.2s;
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:5px;
}

.cat-tab:hover{color:var(--accent)}
.cat-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── Search bar ── */
.search-wrap{
  max-width:680px;
  margin:20px auto 0;
  padding:0 16px;
}

.search-box{
  display:flex;
  align-items:center;
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:10px 16px;
  gap:10px;
  box-shadow:var(--shadow);
}

.search-box input{
  flex:1;
  border:none;
  outline:none;
  font-size:14px;
  font-family:'Segoe UI',system-ui,sans-serif;
  background:transparent;
  color:var(--text);
}

.search-box input::placeholder{color:var(--text2)}
.search-icon{font-size:16px;color:var(--text2)}

/* ── Content ── */
.content{
  max-width:680px;
  margin:0 auto;
  padding:24px 16px 60px;
}

/* ── Category section ── */
.cat-section{margin-bottom:36px}

.cat-heading{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
  padding-bottom:10px;
  border-bottom:1.5px solid var(--border);
}

.cat-icon{font-size:22px}

.cat-title{
  font-size:18px;
  font-weight:400;
  color:var(--accent);
  letter-spacing:.03em;
}

.cat-count{
  font-size:11px;
  font-family:'Segoe UI',system-ui,sans-serif;
  color:var(--text2);
  margin-left:auto;
}

/* ── Menu item card ── */
.item-card{
  display:flex;
  align-items:flex-start;
  gap:14px;
  padding:14px 0;
  border-bottom:1px solid var(--border);
  transition:.2s;
}

.item-card:last-child{border-bottom:none}
.item-card.unavail{opacity:.45}

.item-emoji{
  font-size:32px;
  width:52px;
  height:52px;
  border-radius:12px;
  background:var(--gold-light);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  border:1px solid rgba(184,149,90,.15);
}

.item-emoji img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:11px;
}

.item-info{flex:1;min-width:0}

.item-name{
  font-size:15px;
  font-weight:600;
  font-family:'Georgia',serif;
  margin-bottom:3px;
  line-height:1.3;
}

.item-desc{
  font-size:12px;
  font-family:'Segoe UI',system-ui,sans-serif;
  color:var(--text2);
  line-height:1.5;
  margin-bottom:6px;
}

.item-meta{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.unavail-tag{
  font-size:10px;
  font-family:'Segoe UI',system-ui,sans-serif;
  font-weight:700;
  padding:2px 8px;
  border-radius:10px;
  background:#fde8e8;
  color:#9b1c1c;
}

.item-right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:4px;
  flex-shrink:0;
}

.item-price{
  font-size:16px;
  font-weight:700;
  font-family:'Segoe UI',system-ui,sans-serif;
  color:var(--accent);
  white-space:nowrap;
}

.item-currency{
  font-size:10px;
  color:var(--text2);
  font-weight:400;
}

/* ── Empty / loading states ── */
.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--text2);
  font-family:'Segoe UI',system-ui,sans-serif;
}

.empty .icon{font-size:48px;margin-bottom:12px}
.empty p{font-size:14px}

/* ── Footer ── */
.menu-footer{
  text-align:center;
  padding:24px 20px 40px;
  background:var(--card);
  border-top:1px solid var(--border);
  font-family:'Segoe UI',system-ui,sans-serif;
}

.menu-footer .footer-logo{
  font-size:18px;
  font-family:'Georgia',serif;
  font-weight:400;
  color:var(--accent);
  margin-bottom:4px;
}

.menu-footer p{
  font-size:12px;
  color:var(--text2);
  line-height:1.8;
}

.updated{
  font-size:10px;
  color:var(--text2);
  text-align:center;
  margin-bottom:12px;
  font-family:'Segoe UI',system-ui,sans-serif;
}

/* ── No-JS fallback ── */
.noscript-msg{
  text-align:center;
  padding:40px;
  font-family:'Segoe UI',system-ui,sans-serif;
  color:var(--text2);
}
</style>
</head>
<body>

<!-- Hero -->
<div class="hero">
  <div class="hero-inner">
    <div class="hotel-badge" id="hotelBadge">Ruvia Hotel &amp; Resort</div>
    <h1>Our <span>Menu</span></h1>
    <div class="hero-sub" id="heroSub">Kampala, Uganda &nbsp;·&nbsp; Restaurant &amp; Room Service</div>
    <div class="live-badge">
      <div class="live-dot"></div>
      Live Menu — Always Up to Date
    </div>
  </div>
</div>

<!-- Category nav (populated by JS) -->
<nav class="cat-nav" id="catNav"></nav>

<!-- Search -->
<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search dishes, drinks…" oninput="filterMenu()">
  </div>
</div>

<!-- Menu content -->
<div class="content" id="menuContent">
  <div class="empty">
    <div class="icon">🍽</div>
    <p>Loading menu…</p>
  </div>
</div>

<!-- Updated timestamp -->
<div class="updated" id="updatedStamp"></div>

<!-- Footer -->
<div class="menu-footer">
  <div class="footer-logo" id="footerName">Ruvia Hotel</div>
  <p id="footerInfo">For reservations or room service, please call reception.<br>All prices in Uganda Shillings (USh).</p>
</div>

<noscript>
  <div class="noscript-msg">
    <p>Please enable JavaScript to view the live menu.</p>
  </div>
</noscript>

<script>
// ── Category display config ───────────────────────────────
const CAT_CONFIG = {
  breakfast:  { label:'Breakfast',   icon:'🌅', order:1 },
  maincourse: { label:'Main Course', icon:'🍽', order:2 },
  snacks:     { label:'Snacks',      icon:'🍟', order:3 },
  beverages:  { label:'Beverages',   icon:'☕', order:4 },
  desserts:   { label:'Desserts',    icon:'🍰', order:5 },
  specials:   { label:'Specials',    icon:'⭐', order:6 },
};

const fmt = n => 'USh ' + Math.round(n||0).toLocaleString();

let allItems = [];
let activeFilter = 'all';

// ── Load data ────────────────────────────────────────────
function loadItems() {
  try {
    // Try RuviaStore first, fallback to localStorage
    if (window.RuviaStore) return RuviaStore.getProducts() || [];
    return JSON.parse(localStorage.getItem('ruvia_products') || '[]');
  } catch(e) { return []; }
}

function loadConfig() {
  const defaults = { hotelName:'Ruvia Hotel', address:'Kampala, Uganda', phone:'+256 700 000000' };
  try { return { ...defaults, ...JSON.parse(localStorage.getItem('ruvia_hotel_config') || '{}') }; }
  catch(e) { return defaults; }
}

// ── Render ───────────────────────────────────────────────
function renderMenu() {
  allItems = loadItems().filter(p => p.availability !== 'unavailable');
  const cfg = loadConfig();

  // Update header
  document.getElementById('hotelBadge').textContent = cfg.hotelName;
  document.getElementById('heroSub').textContent = `${cfg.address} · Restaurant & Room Service`;
  document.getElementById('footerName').textContent = cfg.hotelName;
  document.getElementById('footerInfo').textContent =
    `For reservations or room service, please call ${cfg.phone}.\nAll prices in Uganda Shillings (USh).`;

  // Get sorted categories (respecting print order)
  const cats = [...new Set(allItems.map(p => p.category).filter(Boolean))]
    .sort((a,b) => {
      const oa = CAT_CONFIG[a]?.order ?? 99;
      const ob = CAT_CONFIG[b]?.order ?? 99;
      return oa - ob;
    });

  // Category nav
  const nav = document.getElementById('catNav');
  nav.innerHTML = `<button class="cat-tab active" onclick="scrollToSection('all',this)">All</button>` +
    cats.map(c => {
      const cfg = CAT_CONFIG[c] || { label: c.charAt(0).toUpperCase()+c.slice(1), icon:'🍽' };
      return `<button class="cat-tab" onclick="scrollToSection('${c}',this)">${cfg.icon} ${cfg.label}</button>`;
    }).join('');

  renderFiltered(allItems, cats);
  document.getElementById('updatedStamp').textContent =
    'Menu last updated: ' + new Date().toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function renderFiltered(items, cats) {
  const content = document.getElementById('menuContent');

  if (!items.length) {
    content.innerHTML = `<div class="empty"><div class="icon">🔍</div><p>No items found</p></div>`;
    return;
  }

  // Group by category (maintaining print order)
  const grouped = {};
  items.forEach(p => {
    const c = p.category || 'other';
    if (!grouped[c]) grouped[c] = [];
    grouped[c].push(p);
  });

  const sortedCats = Object.keys(grouped).sort((a,b) => {
    const oa = CAT_CONFIG[a]?.order ?? 99;
    const ob = CAT_CONFIG[b]?.order ?? 99;
    return oa - ob;
  });

  content.innerHTML = sortedCats.map(cat => {
    const catCfg = CAT_CONFIG[cat] || { label: cat.charAt(0).toUpperCase()+cat.slice(1), icon:'🍽' };
    const catItems = grouped[cat];
    return `
      <div class="cat-section" id="section-${cat}">
        <div class="cat-heading">
          <span class="cat-icon">${catCfg.icon}</span>
          <span class="cat-title">${catCfg.label}</span>
          <span class="cat-count">${catItems.length} item${catItems.length !== 1 ? 's' : ''}</span>
        </div>
        ${catItems.map(p => renderItem(p)).join('')}
      </div>`;
  }).join('');
}

function renderItem(p) {
  const unavail = p.availability === 'unavailable';
  const imgHtml = p.image_url
    ? `<div class="item-emoji"><img src="${p.image_url}" alt="${p.name}"></div>`
    : `<div class="item-emoji">${p.emoji || '🍽'}</div>`;

  return `
    <div class="item-card${unavail ? ' unavail' : ''}">
      ${imgHtml}
      <div class="item-info">
        <div class="item-name">${p.name}</div>
        ${p.description ? `<div class="item-desc">${p.description}</div>` : ''}
        <div class="item-meta">
          ${unavail ? `<span class="unavail-tag">Temporarily unavailable</span>` : ''}
        </div>
      </div>
      <div class="item-right">
        <div class="item-price">
          <span class="item-currency">USh</span>${Math.round(p.unit_price||0).toLocaleString()}
        </div>
      </div>
    </div>`;
}

// ── Filter / search ──────────────────────────────────────
function filterMenu() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const filtered = q ? allItems.filter(p =>
    p.name.toLowerCase().includes(q) ||
    (p.description || '').toLowerCase().includes(q) ||
    (p.category || '').toLowerCase().includes(q)
  ) : allItems;

  const cats = [...new Set(filtered.map(p => p.category).filter(Boolean))];
  renderFiltered(filtered, cats);
}

// ── Category scroll nav ──────────────────────────────────
function scrollToSection(cat, btn) {
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  if (cat === 'all') {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const el = document.getElementById('section-' + cat);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Intersection observer for active tab ─────────────────
function initScrollSpy() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const cat = entry.target.id.replace('section-','');
        document.querySelectorAll('.cat-tab').forEach(t => {
          t.classList.toggle('active', t.textContent.includes(
            (CAT_CONFIG[cat]?.label || cat)
          ));
        });
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });

  document.querySelectorAll('.cat-section').forEach(el => observer.observe(el));
}

// ── Boot ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  renderMenu();
  setTimeout(initScrollSpy, 200);
});

// Auto-refresh every 60s if menu updates
setInterval(renderMenu, 60000);
</script>
</body>
</html>

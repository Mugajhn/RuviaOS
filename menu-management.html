<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RuviaOS – Menu Management</title>
<link rel="stylesheet" href="darkmode.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;padding:20px}
.container{max-width:1400px;margin:0 auto}
.header{background:linear-gradient(135deg,#1a3c34,#2c5f4a);color:#fff;padding:18px 22px;border-radius:12px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--card,#fff);padding:16px;border-radius:12px;text-align:center;box-shadow:var(--shadow)}
.stat-value{font-size:28px;font-weight:700;color:var(--accent,#2c5f4a)}
.stat-label{color:var(--text2,#666);margin-top:4px;font-size:12px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:10px 20px;background:var(--card,#fff);border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;color:var(--text,#222);transition:all .2s}
.tab.active{background:var(--accent,#2c5f4a);color:#fff}
.tab-content{display:none}.tab-content.active{display:block}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;min-width:160px;padding:9px 14px;border:1px solid var(--input-border,#ddd);border-radius:8px;font-size:13px;background:var(--input-bg,#fff);color:var(--text,#222)}
.cat-filter{padding:9px 12px;border:1px solid var(--input-border,#ddd);border-radius:8px;font-size:13px;background:var(--input-bg,#fff);color:var(--text,#222)}
.btn{padding:9px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px;margin:2px;transition:all .2s}
.btn-primary{background:var(--accent,#2c5f4a);color:#fff}
.btn-primary:hover{background:var(--accent2,#1a3c34)}
.btn-warning{background:#ffc107;color:#333}
.btn-danger{background:#dc3545;color:#fff}
.btn-sm{padding:5px 10px;font-size:11px}
.table-container{background:var(--card,#fff);border-radius:12px;overflow-x:auto;box-shadow:var(--shadow);margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--border,#eee);font-size:12px}
th{background:var(--th-bg,#f8f9fa);font-weight:600;color:var(--text,#222)}
tr:hover{background:var(--row-hover,#f5f7fa)}
.form-container{background:var(--card,#fff);padding:18px;border-radius:12px;margin-bottom:16px;box-shadow:var(--shadow)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-weight:600;margin-bottom:4px;font-size:12px;color:var(--text2,#555)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px;border:1px solid var(--input-border,#ddd);border-radius:7px;font-size:13px;background:var(--input-bg,#fff);color:var(--text,#222)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);justify-content:center;align-items:center;z-index:1000}
.modal-content{background:var(--card,#fff);padding:22px;border-radius:14px;max-width:480px;width:92%;max-height:85vh;overflow-y:auto;color:var(--text,#222)}
.modal-content h3{margin-bottom:14px;color:var(--accent,#2c5f4a)}
.cat-tag{display:inline-flex;align-items:center;gap:6px;background:var(--th-bg,#e9ecef);padding:5px 12px;border-radius:20px;font-size:12px;margin:3px;color:var(--text,#222)}
.cat-rm{color:#dc3545;cursor:pointer;font-weight:700}
.badge{padding:3px 9px;border-radius:14px;font-size:11px;font-weight:700}
.badge-active{background:#d4edda;color:#155724}
.badge-inactive{background:#f8d7da;color:#721c24}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:9px;display:none;z-index:9999;font-size:13px;font-weight:600;color:#fff}
.toast.success{background:#28a745}.toast.error{background:#dc3545}
@media(max-width:768px){.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="navbar-placeholder"></div>
<script src="navbar.js"></script>
<script src="darkmode.js"></script>
<script src="ruvia-store.js"></script>

<div class="container">
<div class="header">
  <h1>📋 Menu Management</h1>
  <button class="btn btn-primary" style="background:rgba(255,255,255,.2);border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600" onclick="loadAll()">🔄 Refresh</button>
</div>

<div class="stats-grid">
  <div class="stat-card"><div class="stat-value" id="stItems">-</div><div class="stat-label">Menu Items</div></div>
  <div class="stat-card"><div class="stat-value" id="stCats">-</div><div class="stat-label">Categories</div></div>
  <div class="stat-card"><div class="stat-value" id="stLow" style="color:#e0a800">-</div><div class="stat-label">Low Stock</div></div>
  <div class="stat-card"><div class="stat-value" id="stOut" style="color:#dc3545">-</div><div class="stat-label">Out of Stock</div></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('items',this)">📋 Menu Items</button>
  <button class="tab" onclick="showTab('add',this)">➕ Add Item</button>
  <button class="tab" onclick="showTab('categories',this)">📁 Categories</button>
</div>

<!-- ITEMS TAB -->
<div id="tab-items" class="tab-content active">
  <div class="toolbar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search items..." oninput="loadAll()">
    <select id="catFilter" class="cat-filter" onchange="loadAll()">
      <option value="">All Categories</option>
    </select>
    <button class="btn btn-primary" onclick="showTab('add',document.querySelectorAll('.tab')[1])">➕ Add Item</button>
  </div>
  <div class="table-container"><table>
    <thead><tr><th>Icon</th><th>Item Name</th><th>Category</th><th>Price (UGX)</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="itemsBody"></tbody>
  </table></div>
</div>

<!-- ADD ITEM TAB -->
<div id="tab-add" class="tab-content">
  <div class="form-container">
    <h3 style="margin-bottom:14px;color:var(--accent,#2c5f4a)">Add New Menu Item</h3>
    <div class="form-row">
      <div class="form-group"><label>Item Name *</label><input id="aName" placeholder="e.g. Grilled Tilapia"></div>
      <div class="form-group"><label>Category *</label><select id="aCat"></select></div>
      <div class="form-group"><label>Price (UGX) *</label><input type="number" id="aPrice" step="500" placeholder="25000"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Emoji</label><input id="aEmoji" placeholder="🍽️" maxlength="4" value="🍽️"></div>
      <div class="form-group"><label>Initial Stock</label><input type="number" id="aStock" value="20"></div>
      <div class="form-group"><label>Reorder Level</label><input type="number" id="aReorder" value="10"></div>
    </div>
    <div class="form-group"><label>Description</label><textarea id="aDesc" rows="2" placeholder="Brief description of the item..."></textarea></div>
    <div class="form-group"><label>Unit Cost (UGX)</label><input type="number" id="aCost" step="500" placeholder="15000"></div>
    <button class="btn btn-primary" onclick="addItem()">➕ Add to Menu</button>
  </div>
</div>

<!-- CATEGORIES TAB -->
<div id="tab-categories" class="tab-content">
  <div class="form-container">
    <h3 style="margin-bottom:12px;color:var(--accent,#2c5f4a)">Existing Categories</h3>
    <div id="catList" style="margin-bottom:20px"></div>
    <hr style="border-color:var(--border,#eee);margin-bottom:16px">
    <h3 style="margin-bottom:12px;color:var(--accent,#2c5f4a)">Add New Category</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <input type="text" id="newCatInput" placeholder="e.g. Seafood" style="flex:1;padding:9px;border:1px solid var(--input-border,#ddd);border-radius:7px;font-size:13px;background:var(--input-bg,#fff);color:var(--text,#222)">
      <input type="text" id="newCatEmoji" placeholder="🐟" maxlength="4" style="width:70px;padding:9px;border:1px solid var(--input-border,#ddd);border-radius:7px;font-size:13px;background:var(--input-bg,#fff);color:var(--text,#222)">
      <button class="btn btn-primary" onclick="addCategory()">Add</button>
    </div>
  </div>
</div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>Edit Item</h3>
    <div class="form-group"><label>Name</label><input id="eName"></div>
    <div class="form-group"><label>Category</label><select id="eCat"></select></div>
    <div class="form-group"><label>Price (UGX)</label><input type="number" id="ePrice" step="500"></div>
    <div class="form-group"><label>Stock</label><input type="number" id="eStock"></div>
    <div class="form-group"><label>Reorder Level</label><input type="number" id="eReorder"></div>
    <div class="form-group"><label>Emoji</label><input id="eEmoji" maxlength="4"></div>
    <div class="form-group"><label>Description</label><textarea id="eDesc" rows="2"></textarea></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-primary" onclick="saveEdit()">Save</button>
      <button class="btn btn-danger" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let _editId=null;
const CAT_LABELS={breakfast:'🍳 Breakfast',maincourse:'🍽️ Main Course',snacks:'🍔 Snacks',beverages:'🥤 Beverages',spa:'💆 Spa',other:'📦 Other'};
const fmt=n=>'UGX '+Math.round(n||0).toLocaleString();

function toast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
function showTab(n,btn){document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+n).classList.add('active');if(btn)btn.classList.add('active');}
function closeModal(){document.getElementById('editModal').style.display='none';}
window.onclick=e=>{if(e.target.classList.contains('modal'))e.target.style.display='none';}

function loadAll(){
  const products=RuviaStore.getProducts();
  const q=document.getElementById('searchInput').value.toLowerCase();
  const cf=document.getElementById('catFilter').value;
  let list=products;
  if(q) list=list.filter(p=>p.name.toLowerCase().includes(q)||p.category.includes(q));
  if(cf) list=list.filter(p=>p.category===cf);

  const cats=[...new Set(products.map(p=>p.category))];
  const low=products.filter(p=>p.current_stock>0&&p.current_stock<=p.reorder_level).length;
  const out=products.filter(p=>p.current_stock===0).length;
  document.getElementById('stItems').textContent=products.length;
  document.getElementById('stCats').textContent=cats.length;
  document.getElementById('stLow').textContent=low;
  document.getElementById('stOut').textContent=out;

  // Populate category dropdowns
  const catOpts='<option value="">All</option>'+cats.map(c=>`<option value="${c}">${CAT_LABELS[c]||c}</option>`).join('');
  document.getElementById('catFilter').innerHTML='<option value="">All Categories</option>'+cats.map(c=>`<option value="${c}">${CAT_LABELS[c]||c}</option>`).join('');
  document.getElementById('aCat').innerHTML=cats.map(c=>`<option value="${c}">${CAT_LABELS[c]||c}</option>`).join('');
  document.getElementById('eCat').innerHTML=cats.map(c=>`<option value="${c}">${CAT_LABELS[c]||c}</option>`).join('');

  // Category list
  document.getElementById('catList').innerHTML=cats.length===0?`<p style="color:var(--text2)">No categories yet</p>`:
    cats.map(c=>`<span class="cat-tag">${CAT_LABELS[c]||c}<span class="cat-rm" onclick="removeCategory('${c}')">✕</span></span>`).join('');

  // Items table
  document.getElementById('itemsBody').innerHTML=list.length===0
    ?`<tr><td colspan="7" style="text-align:center;color:var(--text2);padding:24px">No items found</td></tr>`
    :list.map(p=>{
      const isOut=p.current_stock===0,isLow=!isOut&&p.current_stock<=p.reorder_level;
      const stockColor=isOut?'#dc3545':isLow?'#e0a800':'#28a745';
      const statusLabel=isOut?'Out of Stock':isLow?'Low Stock':'In Stock';
      return `<tr>
        <td style="font-size:26px">${p.emoji||'🍽️'}</td>
        <td><strong>${p.name}</strong>${p.description?`<br><small style="color:var(--text2)">${p.description}</small>`:''}</td>
        <td style="text-transform:capitalize">${CAT_LABELS[p.category]||p.category}</td>
        <td>${fmt(p.unit_price)}</td>
        <td><strong style="color:${stockColor}">${p.current_stock}</strong></td>
        <td><span style="color:${stockColor};font-weight:600;font-size:11px">${statusLabel}</span></td>
        <td>
          <button class="btn btn-warning btn-sm" onclick="openEdit(${p.id})">✏️ Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteItem(${p.id})">🗑️</button>
        </td>
      </tr>`;
    }).join('');
}

function addItem(){
  const name=document.getElementById('aName').value.trim();
  const cat=document.getElementById('aCat').value;
  const price=parseInt(document.getElementById('aPrice').value)||0;
  if(!name||!cat||!price){toast('Fill in name, category, and price','error');return;}
  RuviaStore.addProduct({
    name,category:cat,
    unit_price:price,
    unit_cost:parseInt(document.getElementById('aCost').value)||0,
    current_stock:parseInt(document.getElementById('aStock').value)||0,
    reorder_level:parseInt(document.getElementById('aReorder').value)||10,
    emoji:document.getElementById('aEmoji').value||'🍽️',
    description:document.getElementById('aDesc').value,
    sku:'MENU-'+Date.now(),
    location:'Kitchen'
  });
  toast(`✅ ${name} added to menu`);
  ['aName','aDesc','aCost'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('aPrice').value='';
  document.getElementById('aStock').value='20';
  showTab('items',document.querySelectorAll('.tab')[0]);
  loadAll();
}

function openEdit(id){
  const p=RuviaStore.getProducts().find(x=>x.id===id);if(!p)return;
  _editId=id;
  document.getElementById('eName').value=p.name||'';
  document.getElementById('eCat').value=p.category||'';
  document.getElementById('ePrice').value=p.unit_price||'';
  document.getElementById('eStock').value=p.current_stock||0;
  document.getElementById('eReorder').value=p.reorder_level||10;
  document.getElementById('eEmoji').value=p.emoji||'🍽️';
  document.getElementById('eDesc').value=p.description||'';
  document.getElementById('editModal').style.display='flex';
}
function saveEdit(){
  const products=RuviaStore.getProducts();
  const i=products.findIndex(p=>p.id===_editId);if(i<0)return;
  products[i]={...products[i],
    name:document.getElementById('eName').value,
    category:document.getElementById('eCat').value,
    unit_price:parseInt(document.getElementById('ePrice').value)||products[i].unit_price,
    current_stock:parseInt(document.getElementById('eStock').value)||0,
    reorder_level:parseInt(document.getElementById('eReorder').value)||10,
    emoji:document.getElementById('eEmoji').value||'🍽️',
    description:document.getElementById('eDesc').value
  };
  RuviaStore.saveProducts(products);toast('Item updated');closeModal();loadAll();
}
function deleteItem(id){if(!confirm('Delete this item?'))return;RuviaStore.saveProducts(RuviaStore.getProducts().filter(p=>p.id!==id));toast('Item deleted');loadAll();}

function addCategory(){
  const name=document.getElementById('newCatInput').value.trim();
  if(!name){toast('Enter a category name','error');return;}
  const key=name.toLowerCase().replace(/\s+/g,'_');
  const emoji=document.getElementById('newCatEmoji').value||'📦';
  CAT_LABELS[key]=emoji+' '+name;
  document.getElementById('newCatInput').value='';document.getElementById('newCatEmoji').value='';
  toast('Category added — add items to activate it');loadAll();
}
function removeCategory(cat){
  const has=RuviaStore.getProducts().some(p=>p.category===cat);
  if(has){toast('Category has items — reassign them first','error');return;}
  delete CAT_LABELS[cat];loadAll();toast('Category removed');
}

RuviaStore.onChange(()=>loadAll());
loadAll();
</script>
</body>
</html>

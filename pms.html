<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){
  var s=localStorage.getItem('ruvia-dark');
  if(s==='1'||(!s&&window.matchMedia('(prefers-color-scheme:dark)').matches))
    document.documentElement.classList.add('dark-mode'),document.documentElement.style.background='#0f1117';
})()</script>
<script src="ruvia-auth-guard.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RuviaOS — Reservations</title>
<script>(function(){if(localStorage.getItem('ruvia-dark')==='1')document.documentElement.style.background='#0f1117';})()</script>
<link rel="stylesheet" href="darkmode.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6f9;--card:#fff;--text:#1a1a2e;--text2:#6b7280;--border:#e5e7eb;--accent:#2c5f4a;--accent-light:#e8f5f0;--input-bg:#fff;--th-bg:#f9fafb;--row-hover:#f3f4f6;--shadow-md:0 4px 16px rgba(0,0,0,.08)}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
.page{max-width:1400px;margin:0 auto;padding:24px}
.phdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.phdr h1{font-size:22px;font-weight:700}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{opacity:.9;transform:translateY(-1px)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:22px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:.2s;border-left:4px solid var(--accent)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.tile.warn{border-left-color:#e0a800}.tile.info{border-left-color:#17a2b8}.tile.success{border-left-color:#28a745}.tile.danger{border-left-color:#dc3545}
.tv{font-size:26px;font-weight:700;color:var(--accent);line-height:1}
.tile.warn .tv{color:#e0a800}.tile.info .tv{color:#17a2b8}.tile.success .tv{color:#28a745}
.tl{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.ts{font-size:11px;color:var(--text2);margin-top:2px}
/* tabs */
.tabs{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px;border:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
.tbtn{padding:8px 16px;border-radius:9px;border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.tbtn.on{background:var(--accent);color:#fff}
.tab{display:none}.tab.on{display:block}
/* table */
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;min-width:700px}
th{padding:11px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;background:var(--th-bg);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border)}
tr:last-child td{border:none}
tr:hover td{background:var(--row-hover)}
.pill{padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700}
.p-confirmed{background:#d1ecf1;color:#0c5460}
.p-checked-in{background:#d4edda;color:#155724}
.p-checked-out{background:#f3f4f6;color:#6b7280}
.p-cancelled{background:#f8d7da;color:#721c24}
.p-pending{background:#fff3cd;color:#856404}
.ab{padding:5px 9px;border:1.5px solid var(--border);border-radius:7px;background:transparent;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;margin-right:3px}
.ab:hover{border-color:var(--accent);color:var(--accent)}
/* booking form */
.bform{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px}
.bform h3{font-size:15px;font-weight:700;margin-bottom:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.fg input,.fg select,.fg textarea{padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;background:var(--input-bg);color:var(--text);outline:none;font-family:inherit}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent)}
.rate-preview{background:var(--th-bg);border-radius:10px;padding:13px;margin-top:12px;font-size:13px;display:none}
.rr{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;color:var(--text2)}
.rr.big{font-weight:700;font-size:15px;color:var(--text);padding-top:8px;border-top:1px dashed var(--border);margin-top:5px}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row .btn{flex:1}
.btn-outline{flex:1;padding:10px;background:transparent;border:1.5px solid var(--border);color:var(--text2);border-radius:10px;font-size:13px;cursor:pointer}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.mhdr{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:1}
.mhdr h3{font-size:16px;font-weight:700}
.mbody{padding:20px}
.mfoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.btn-save{background:var(--accent);color:#fff;border:none;padding:10px 22px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.btn-cancel{background:transparent;border:1.5px solid var(--border);color:var(--text2);padding:10px 18px;border-radius:9px;font-size:13px;cursor:pointer}
.btn-danger{background:#dc3545;color:#fff;border:none;padding:10px 22px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.dr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.dr:last-child{border:none}
.dr span:first-child{color:var(--text2)}
.dr span:last-child{font-weight:600}
@media(max-width:640px){.fgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="navbar-placeholder"></div>
<script src="ruvia-core.js"></script>
<script src="navbar.js"></script>

<div class="page">
  <div class="phdr">
    <h1>📅 Reservations & PMS</h1>
    <button class="btn" onclick="switchTab('new-booking')">+ New Booking</button>
  </div>

  <div class="tiles" id="tilesRow"></div>

  <div class="tabs">
    <button class="tbtn on" id="tab-btn-all"        onclick="switchTab('all')">📋 All</button>
    <button class="tbtn"    id="tab-btn-arrivals"   onclick="switchTab('arrivals')">📥 Arrivals</button>
    <button class="tbtn"    id="tab-btn-departures" onclick="switchTab('departures')">📤 Departures</button>
    <button class="tbtn"    id="tab-btn-in-house"   onclick="switchTab('in-house')">🏨 In-House</button>
    <button class="tbtn"    id="tab-btn-new-booking" onclick="switchTab('new-booking')">➕ New Booking</button>
  </div>

  <!-- All reservations -->
  <div class="tab on" id="tab-all">
    <div class="tbl-wrap">
      <table><thead><tr><th>Res #</th><th>Guest</th><th>Room</th><th>Check-In</th><th>Check-Out</th><th>Nights</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="bodyAll"></tbody></table>
    </div>
  </div>

  <!-- Arrivals -->
  <div class="tab" id="tab-arrivals">
    <div class="tbl-wrap">
      <table><thead><tr><th>Res #</th><th>Guest</th><th>Room</th><th>Check-In</th><th>Nights</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="bodyArrivals"></tbody></table>
    </div>
  </div>

  <!-- Departures -->
  <div class="tab" id="tab-departures">
    <div class="tbl-wrap">
      <table><thead><tr><th>Res #</th><th>Guest</th><th>Room</th><th>Check-Out</th><th>Balance</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="bodyDepartures"></tbody></table>
    </div>
  </div>

  <!-- In-House -->
  <div class="tab" id="tab-in-house">
    <div class="tbl-wrap">
      <table><thead><tr><th>Res #</th><th>Guest</th><th>Room</th><th>Check-In</th><th>Check-Out</th><th>Balance</th><th>Actions</th></tr></thead>
      <tbody id="bodyInHouse"></tbody></table>
    </div>
  </div>

  <!-- New Booking -->
  <div class="tab" id="tab-new-booking">
    <div class="bform">
      <h3>📅 New Reservation</h3>
      <div class="fgrid">
        <div class="fg"><label>Guest Full Name</label><input id="bkName" placeholder="Full name" oninput="lookupGuest()"></div>
        <div class="fg"><label>Phone</label><input id="bkPhone" placeholder="+256 ..."></div>
        <div class="fg"><label>Email</label><input type="email" id="bkEmail" placeholder="email@example.com"></div>
        <div class="fg"><label>ID / Passport</label><input id="bkID" placeholder="National ID or Passport"></div>
        <div class="fg"><label>Room</label><select id="bkRoom" onchange="calcRate()"><option value="">Select room...</option></select></div>
        <div class="fg"><label>Adults</label><select id="bkAdults"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
        <div class="fg"><label>Check-In</label><input type="date" id="bkCI" onchange="calcRate()"></div>
        <div class="fg"><label>Check-Out</label><input type="date" id="bkCO" onchange="calcRate()"></div>
        <div class="fg"><label>Payment Method</label>
          <select id="bkPay"><option value="cash">Cash</option><option value="card">Card</option><option value="mobile">Mobile Money</option><option value="bank">Bank Transfer</option></select>
        </div>
        <div class="fg"><label>Deposit Paid (USh)</label><input type="number" id="bkDeposit" placeholder="0" oninput="calcRate()"></div>
      </div>
      <div class="fg"><label>Special Requests</label><textarea id="bkReqs" rows="2" placeholder="Any special requests..."></textarea></div>
      <div class="rate-preview" id="ratePreview"></div>
      <div class="btn-row">
        <button class="btn" onclick="saveBooking()">📅 Confirm Reservation</button>
        <button class="btn-outline" onclick="clearForm()">Clear</button>
      </div>
    </div>
  </div>
</div>

<!-- View/actions modal -->
<div class="overlay" id="resModal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <div class="mhdr"><h3 id="resModalTitle">Reservation</h3><button onclick="document.getElementById('resModal').style.display='none'" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2)">✕</button></div>
    <div class="mbody" id="resModalBody"></div>
    <div class="mfoot" id="resModalFoot"></div>
  </div>
</div>

<script src="ruvia-store.js"></script>
<script>
const fmt = n => 'USh ' + Math.round(n||0).toLocaleString();
const nights = (a,b) => Math.max(1, Math.round((new Date(b)-new Date(a))/86400000));

// ── data layer ───────────────────────────────────────────
const DB = {
  rooms(){    if(window.RuviaStore) return RuviaStore.getRooms();    try{return JSON.parse(localStorage.getItem('ruvia_rooms')||'[]');}catch(e){return[];} },
  res(){      if(window.RuviaStore) return RuviaStore.getReservations(); try{return JSON.parse(localStorage.getItem('ruvia_reservations')||'[]');}catch(e){return[];} },
  guests(){   if(window.RuviaStore) return RuviaStore.getGuests();   try{return JSON.parse(localStorage.getItem('ruvia_guests')||'[]');}catch(e){return[];} },
  saveRes(r){ if(window.RuviaStore){RuviaStore.saveReservation(r);}else{const a=DB.res();const idx=a.findIndex(x=>x.id===r.id);if(idx>=0)a[idx]=r;else a.unshift(r);localStorage.setItem('ruvia_reservations',JSON.stringify(a));} },
  updateResStatus(id,status){ const a=DB.res().map(r=>r.id===id?{...r,status}:r); if(window.RuviaStore){RuviaStore.updateReservationStatus(id,status);}else{localStorage.setItem('ruvia_reservations',JSON.stringify(a));} },
  setRoomStatus(id,status){ if(window.RuviaStore){RuviaStore.updateRoomStatus(id,status);}else{const a=DB.rooms().map(r=>r.id===id?{...r,status}:r);localStorage.setItem('ruvia_rooms',JSON.stringify(a));} },
  saveGuest(g){ if(window.RuviaStore){RuviaStore.saveGuest(g);}else{const a=DB.guests();const idx=a.findIndex(x=>x.id===g.id);if(idx>=0)a[idx]=g;else a.push(g);localStorage.setItem('ruvia_guests',JSON.stringify(a));} }
};

// ── seed rooms ───────────────────────────────────────────
function seedRooms(){
  if(DB.rooms().length) return;
  const data=[
    {id:'rm1',room_number:'101',room_type:'Standard',base_price:80000,status:'ready',floor:1},
    {id:'rm2',room_number:'102',room_type:'Standard',base_price:80000,status:'ready',floor:1},
    {id:'rm3',room_number:'103',room_type:'Standard',base_price:80000,status:'occupied',floor:1},
    {id:'rm4',room_number:'201',room_type:'Deluxe',base_price:120000,status:'ready',floor:2},
    {id:'rm5',room_number:'202',room_type:'Deluxe',base_price:120000,status:'dirty',floor:2},
    {id:'rm6',room_number:'203',room_type:'Deluxe',base_price:120000,status:'ready',floor:2},
    {id:'rm7',room_number:'301',room_type:'Suite',base_price:200000,status:'ready',floor:3},
    {id:'rm8',room_number:'302',room_type:'Suite',base_price:200000,status:'ready',floor:3},
    {id:'rm9',room_number:'401',room_type:'Executive',base_price:280000,status:'ready',floor:4},
    {id:'rm10',room_number:'402',room_type:'Executive',base_price:280000,status:'ready',floor:4},
  ];
  localStorage.setItem('ruvia_rooms', JSON.stringify(data));
}

// ── boot ─────────────────────────────────────────────────
function boot(){
  seedRooms();
  populateRooms();
  const today = new Date().toISOString().slice(0,10);
  const tom = new Date(); tom.setDate(tom.getDate()+1);
  document.getElementById('bkCI').value = today;
  document.getElementById('bkCI').min   = today;
  document.getElementById('bkCO').value = tom.toISOString().slice(0,10);
  document.getElementById('bkCO').min   = tom.toISOString().slice(0,10);
  renderAll();
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-'+name)?.classList.add('on');
  document.getElementById('tab-btn-'+name)?.classList.add('on');
  renderAll();
}

function populateRooms(){
  const avail = DB.rooms().filter(r=>r.status==='ready'||r.status==='occupied');
  const sel   = document.getElementById('bkRoom');
  sel.innerHTML = '<option value="">Select room...</option>' +
    avail.map(r=>`<option value="${r.id}" data-price="${r.base_price||80000}">Room ${r.room_number} — ${r.room_type} (${r.status}) · ${fmt(r.base_price)}/night</option>`).join('');
}

function renderAll(){
  renderTiles();
  renderAllRes();
  renderArrivals();
  renderDepartures();
  renderInHouse();
}

// ── tiles ─────────────────────────────────────────────────
function renderTiles(){
  const res   = DB.res();
  const rooms = DB.rooms();
  const today = new Date().toISOString().slice(0,10);
  const occ   = rooms.filter(r=>r.status==='occupied').length;
  const arr   = res.filter(r=>r.status==='confirmed'&&r.check_in<=today).length;
  const dep   = res.filter(r=>r.status==='checked-in'&&r.check_out<=today).length;
  const ih    = res.filter(r=>r.status==='checked-in').length;
  const rev   = res.reduce((s,r)=>s+(r.paid_amount||0),0);
  document.getElementById('tilesRow').innerHTML = [
    {icon:'🛏',lbl:'Total Rooms',val:rooms.length,sub:occ+' occupied',cls:'',tab:'all'},
    {icon:'📥',lbl:'Arrivals',val:arr,sub:'Due today',cls:'info',tab:'arrivals'},
    {icon:'📤',lbl:'Departures',val:dep,sub:'Due today',cls:'warn',tab:'departures'},
    {icon:'🏨',lbl:'In-House',val:ih,sub:'Checked in',cls:'success',tab:'in-house'},
    {icon:'💰',lbl:'Revenue',val:'USh '+Math.round(rev/1000)+'K',sub:'Collected',cls:'',tab:'all'},
  ].map(t=>`
    <div class="tile ${t.cls}" onclick="switchTab('${t.tab}')">
      <div class="tv">${t.val}</div>
      <div class="tl">${t.icon} ${t.lbl}</div>
      <div class="ts">${t.sub}</div>
    </div>`).join('');
}

// ── helpers ───────────────────────────────────────────────
const pill = s => {
  const m={confirmed:'p-confirmed','checked-in':'p-checked-in','checked-out':'p-checked-out',cancelled:'p-cancelled',pending:'p-pending'};
  return `<span class="pill ${m[s]||''}">${s}</span>`;
};
const gname = id => DB.guests().find(x=>x.id===id)?.full_name||'Unknown';
const rnum  = id => 'Room '+(DB.rooms().find(x=>x.id===id)?.room_number||'?');

// ── all reservations ──────────────────────────────────────
function renderAllRes(){
  const sorted = [...DB.res()].sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  document.getElementById('bodyAll').innerHTML = sorted.length
    ? sorted.map(r=>`
        <tr>
          <td><strong>${r.reservation_number}</strong></td>
          <td>${gname(r.guest_id)}</td>
          <td>${rnum(r.room_id)}</td>
          <td>${r.check_in}</td>
          <td>${r.check_out}</td>
          <td>${r.nights||1}</td>
          <td>${fmt(r.total_amount)}</td>
          <td>${pill(r.status)}</td>
          <td>
            <button class="ab" onclick="viewRes('${r.id}')">View</button>
            ${r.status==='confirmed'?`<button class="ab" onclick="doCheckIn('${r.id}')">Check In</button>`:''}
            ${r.status==='checked-in'?`<button class="ab" onclick="doCheckOut('${r.id}')">Check Out</button>`:''}
          </td>
        </tr>`).join('')
    : '<tr><td colspan="9" style="text-align:center;padding:28px;color:var(--text2);font-style:italic">No reservations yet. Create the first one →</td></tr>';
}

// ── arrivals ──────────────────────────────────────────────
function renderArrivals(){
  const today = new Date().toISOString().slice(0,10);
  const arr   = DB.res().filter(r=>r.status==='confirmed'&&r.check_in<=today);
  document.getElementById('bodyArrivals').innerHTML = arr.length
    ? arr.map(r=>`
        <tr>
          <td><strong>${r.reservation_number}</strong></td>
          <td>${gname(r.guest_id)}</td>
          <td>${rnum(r.room_id)}</td>
          <td>${r.check_in}</td>
          <td>${r.nights||1}</td>
          <td>${fmt(r.total_amount)}</td>
          <td>${pill(r.status)}</td>
          <td><button class="ab" onclick="doCheckIn('${r.id}')">✅ Check In</button><button class="ab" onclick="viewRes('${r.id}')">View</button></td>
        </tr>`).join('')
    : '<tr><td colspan="8" style="text-align:center;padding:28px;color:var(--text2);font-style:italic">No arrivals today</td></tr>';
}

// ── departures ────────────────────────────────────────────
function renderDepartures(){
  const today = new Date().toISOString().slice(0,10);
  const dep   = DB.res().filter(r=>r.status==='checked-in'&&r.check_out<=today);
  document.getElementById('bodyDepartures').innerHTML = dep.length
    ? dep.map(r=>`
        <tr>
          <td><strong>${r.reservation_number}</strong></td>
          <td>${gname(r.guest_id)}</td>
          <td>${rnum(r.room_id)}</td>
          <td>${r.check_out}</td>
          <td style="color:${(r.balance||0)>0?'#dc3545':'#28a745'}">${fmt(r.balance||0)}</td>
          <td>${pill(r.status)}</td>
          <td><button class="ab" onclick="doCheckOut('${r.id}')">🚪 Check Out</button></td>
        </tr>`).join('')
    : '<tr><td colspan="7" style="text-align:center;padding:28px;color:var(--text2);font-style:italic">No departures today</td></tr>';
}

// ── in-house ──────────────────────────────────────────────
function renderInHouse(){
  const ih = DB.res().filter(r=>r.status==='checked-in');
  document.getElementById('bodyInHouse').innerHTML = ih.length
    ? ih.map(r=>`
        <tr>
          <td><strong>${r.reservation_number}</strong></td>
          <td>${gname(r.guest_id)}</td>
          <td>${rnum(r.room_id)}</td>
          <td>${r.check_in}</td>
          <td>${r.check_out}</td>
          <td style="color:${(r.balance||0)>0?'#dc3545':'#28a745'}">${fmt(r.balance||0)}</td>
          <td><button class="ab" onclick="doCheckOut('${r.id}')">🚪 Check Out</button><button class="ab" onclick="viewRes('${r.id}')">View</button></td>
        </tr>`).join('')
    : '<tr><td colspan="7" style="text-align:center;padding:28px;color:var(--text2);font-style:italic">No guests currently in-house</td></tr>';
}

// ── rate calculator ───────────────────────────────────────
function calcRate(){
  const sel = document.getElementById('bkRoom');
  const ci  = document.getElementById('bkCI').value;
  const co  = document.getElementById('bkCO').value;
  const dep = parseFloat(document.getElementById('bkDeposit').value)||0;
  const box = document.getElementById('ratePreview');
  if(!sel.value||!ci||!co||new Date(co)<=new Date(ci)){box.style.display='none';return;}
  const price = parseFloat(sel.selectedOptions[0]?.dataset.price)||80000;
  const n = nights(ci,co);
  const sub = price*n, vat=Math.round(sub*0.18), tot=sub+vat, bal=Math.max(0,tot-dep);
  box.style.display='block';
  box.innerHTML=`
    <div style="font-size:13px;font-weight:600;margin-bottom:8px">💰 Rate Preview</div>
    <div class="rr"><span>${n} night(s) × ${fmt(price)}</span><span>${fmt(sub)}</span></div>
    <div class="rr"><span>VAT 18%</span><span>${fmt(vat)}</span></div>
    ${dep?`<div class="rr"><span>Deposit</span><span style="color:#28a745">− ${fmt(dep)}</span></div>`:''}
    <div class="rr big"><span>Total</span><span style="color:var(--accent)">${fmt(tot)}</span></div>
    ${bal>0?`<div class="rr big"><span>Balance Due</span><span style="color:#dc3545">${fmt(bal)}</span></div>`:''}`;
}

function lookupGuest(){
  const n = document.getElementById('bkName').value.toLowerCase();
  if(n.length<3) return;
  const g = DB.guests().find(x=>x.full_name?.toLowerCase().includes(n));
  if(g){ if(g.phone) document.getElementById('bkPhone').value=g.phone; if(g.email) document.getElementById('bkEmail').value=g.email||''; }
}

function saveBooking(){
  const name  = document.getElementById('bkName').value.trim();
  const phone = document.getElementById('bkPhone').value.trim();
  const email = document.getElementById('bkEmail').value.trim();
  const idnum = document.getElementById('bkID').value.trim();
  const roomId= document.getElementById('bkRoom').value;
  const ci    = document.getElementById('bkCI').value;
  const co    = document.getElementById('bkCO').value;
  const dep   = parseFloat(document.getElementById('bkDeposit').value)||0;

  if(!name||!roomId||!ci||!co){ alert('Please fill in guest name, room and dates.'); return; }
  if(new Date(co)<=new Date(ci)){ alert('Check-out must be after check-in.'); return; }

  const room  = DB.rooms().find(r=>r.id===roomId);
  const price = room?.base_price||80000;
  const n     = nights(ci,co);
  const sub   = price*n, vat=Math.round(sub*0.18), tot=sub+vat;

  let guest = DB.guests().find(g=>g.full_name?.toLowerCase()===name.toLowerCase());
  if(!guest){ guest={id:'g'+Date.now(),full_name:name,phone,email,id_number:idnum,created_at:new Date().toISOString()}; DB.saveGuest(guest); }

  const num = 'RES-'+Date.now().toString().slice(-6);
  const res = {
    id:'r'+Date.now(), reservation_number:num,
    guest_id:guest.id, room_id:roomId,
    check_in:ci, check_out:co,
    adults:parseInt(document.getElementById('bkAdults').value)||2,
    nights:n, base_price:price, subtotal:sub, vat, total_amount:tot,
    paid_amount:dep, balance:Math.max(0,tot-dep),
    payment_method:document.getElementById('bkPay').value,
    special_requests:document.getElementById('bkReqs').value.trim(),
    status:'confirmed', created_at:new Date().toISOString(),
    created_by:localStorage.getItem('ruviaos_user')||'staff'
  };
  DB.saveRes(res);
  log(`Booking ${num} created for ${name} — Room ${room?.room_number}`, 'booking');
  alert(`✅ Reservation ${num} confirmed for ${name}!`);
  clearForm();
  switchTab('all');
}

function clearForm(){
  ['bkName','bkPhone','bkEmail','bkID','bkDeposit','bkReqs'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('bkRoom').value='';
  document.getElementById('ratePreview').style.display='none';
}

// ── check in / out ────────────────────────────────────────
function doCheckIn(id){
  DB.updateResStatus(id,'checked-in');
  const r = DB.res().find(x=>x.id===id);
  if(r) DB.setRoomStatus(r.room_id,'occupied');
  log(`${gname(r?.guest_id)} checked in`, 'checkin');
  renderAll();
}

function doCheckOut(id){
  if(!confirm('Confirm check out?')) return;
  DB.updateResStatus(id,'checked-out');
  const r = DB.res().find(x=>x.id===id);
  if(r) DB.setRoomStatus(r.room_id,'dirty');
  log(`${gname(r?.guest_id)} checked out`, 'checkout');
  document.getElementById('resModal').style.display='none';
  renderAll();
}

// ── view reservation modal ────────────────────────────────
function viewRes(id){
  const r  = DB.res().find(x=>x.id===id);
  const g  = DB.guests().find(x=>x.id===r.guest_id)||{};
  const rm = DB.rooms().find(x=>x.id===r.room_id)||{};
  document.getElementById('resModalTitle').textContent = r.reservation_number;
  document.getElementById('resModalBody').innerHTML = `
    <div class="dr"><span>Guest</span><span>${g.full_name||'—'}</span></div>
    <div class="dr"><span>Phone</span><span>${g.phone||'—'}</span></div>
    <div class="dr"><span>Email</span><span>${g.email||'—'}</span></div>
    <div class="dr"><span>Room</span><span>Room ${rm.room_number||'?'} — ${rm.room_type||''}</span></div>
    <div class="dr"><span>Check-In</span><span>${r.check_in}</span></div>
    <div class="dr"><span>Check-Out</span><span>${r.check_out}</span></div>
    <div class="dr"><span>Nights</span><span>${r.nights||1}</span></div>
    <div class="dr"><span>Total</span><span style="color:var(--accent)">${fmt(r.total_amount)}</span></div>
    <div class="dr"><span>Paid</span><span style="color:#28a745">${fmt(r.paid_amount||0)}</span></div>
    <div class="dr"><span>Balance</span><span style="color:#dc3545">${fmt(r.balance||0)}</span></div>
    <div class="dr"><span>Payment</span><span style="text-transform:capitalize">${r.payment_method||'cash'}</span></div>
    <div class="dr"><span>Status</span><span>${pill(r.status)}</span></div>
    ${r.special_requests?`<div style="margin-top:12px;padding:10px;background:var(--th-bg);border-radius:9px;font-size:12px;color:var(--text2)"><strong>Requests:</strong> ${r.special_requests}</div>`:''}`;
  document.getElementById('resModalFoot').innerHTML = `
    ${r.status==='confirmed'?`<button class="btn-save" onclick="doCheckIn('${id}');document.getElementById('resModal').style.display='none'">✅ Check In</button>`:''}
    ${r.status==='checked-in'?`<button class="btn-danger" onclick="doCheckOut('${id}')">🚪 Check Out</button>`:''}
    <button class="btn-cancel" onclick="document.getElementById('resModal').style.display='none'">Close</button>`;
  document.getElementById('resModal').style.display='flex';
}

function log(msg,type){ const u=localStorage.getItem('ruviaos_user')||'staff'; try{const a=JSON.parse(localStorage.getItem('ruvia_activity_log')||'[]');a.unshift({id:Date.now(),type,message:msg,username:u,category:type,time:new Date().toISOString()});localStorage.setItem('ruvia_activity_log',JSON.stringify(a.slice(0,500)));}catch(e){} }

if(window.RuviaStore) RuviaStore.onChange(renderAll);
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>

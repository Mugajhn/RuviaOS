<html lang="en">
<head>

  var s=localStorage.getItem('ruvia-dark');
  if(s==='1'||(!s&&window.matchMedia('(prefers-color-scheme:dark)').matches))
    document.documentElement.classList.add('dark-mode'),document.documentElement.style.background='#0f1117';
})()</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6f9;--card:#fff;--text:#1a1a2e;--text2:#6b7280;--border:#e5e7eb;--accent:#2c5f4a;--accent-light:#e8f5f0;--input-bg:#fff;--th-bg:#f9fafb;--shadow-md:0 4px 16px rgba(0,0,0,.1)}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* ─ layout ─ */
.pos-wrap{display:flex;flex:1;overflow:hidden}
/* ─ left panel ─ */
.left{flex:1;display:flex;flex-direction:column;overflow:hidden;border-right:2px solid var(--border)}
.toolbar{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:150px;padding:9px 14px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;background:var(--input-bg);color:var(--text);outline:none}
.search:focus{border-color:var(--accent)}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;flex-shrink:0}
.cat.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;align-content:start}
.tile{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:14px 12px;cursor:pointer;transition:.2s;text-align:center;user-select:none}
.tile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.tile:active{transform:scale(.96)}
.tile-emoji{font-size:34px;display:block;margin-bottom:8px;line-height:1}
.tile-name{font-size:12px;font-weight:600;margin-bottom:4px;line-height:1.3}
.tile-price{font-size:13px;font-weight:700;color:var(--accent)}
/* ─ right/cart panel ─ */
.right{width:340px;display:flex;flex-direction:column;background:var(--card);flex-shrink:0}
.cart-hdr{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cart-hdr h3{font-size:15px;font-weight:700}
.cashier-tag{font-size:11px;color:var(--text2);background:var(--th-bg);padding:4px 10px;border-radius:20px}
.cart-body{flex:1;overflow-y:auto;padding:10px 14px}
.cart-empty{text-align:center;padding:50px 20px;color:var(--text2);font-size:13px;font-style:italic}
.citem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.citem:last-child{border-bottom:none}
.citem-emoji{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.citem-info{flex:1;min-width:0}
.citem-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem-unit{font-size:11px;color:var(--text2);margin-top:1px}
.citem-qty{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qbtn{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--border);background:var(--th-bg);color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;transition:.15s;padding:0;line-height:1}
.qbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.qnum{font-size:13px;font-weight:700;min-width:20px;text-align:center}
.citem-total{font-size:13px;font-weight:700;color:var(--accent);min-width:72px;text-align:right;flex-shrink:0}
/* ─ cart footer ─ */
.cart-foot{border-top:1px solid var(--border);padding:14px 16px}
.summary{background:var(--th-bg);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.srow{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);padding:3px 0}
.srow.big{font-size:16px;font-weight:700;color:var(--text);padding-top:8px;border-top:1px dashed var(--border);margin-top:4px}
.srow.big span:last-child{color:var(--accent)}
.pay-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.pbtn{padding:8px 4px;border:1.5px solid var(--border);border-radius:9px;background:var(--card);font-size:11px;font-weight:600;cursor:pointer;text-align:center;color:var(--text);transition:.15s}
.pbtn.on{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.meta-row{display:flex;gap:8px;margin-bottom:10px}
.meta-row select,.meta-row input{flex:1;padding:8px 10px;border:1.5px solid var(--border);border-radius:9px;font-size:12px;background:var(--input-bg);color:var(--text);outline:none}
.charge-btn{width:100%;padding:14px;background:linear-gradient(135deg,#2c5f4a,#1a3c34);color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.01em}
.charge-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(44,95,74,.4)}
.charge-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.clear-btn{width:100%;padding:9px;background:transparent;border:1.5px solid var(--border);color:var(--text2);border-radius:9px;font-size:12px;cursor:pointer;margin-top:6px;transition:.15s}
.clear-btn:hover{border-color:#dc3545;color:#dc3545}
/* ─ receipt overlay ─ */
.rcpt-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.rcpt-box{background:var(--card);border-radius:16px;max-width:480px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.rcpt-top{padding:14px 20px;background:#1a3c34;color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:600;flex-shrink:0}
.rcpt-acts{display:flex;gap:8px;padding:10px 18px;background:var(--th-bg);border-bottom:1px solid var(--border);flex-shrink:0}
.rbtn{padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.rcpt-scroll{overflow-y:auto;padding:20px;background:var(--bg)}
.paper{background:#fff;padding:22px;border-radius:6px;font-family:'Courier New',monospace;font-size:12px;max-width:300px;margin:0 auto;color:#222}
.p-hotel{text-align:center;font-size:15px;font-weight:700;margin-bottom:2px}
.p-sub{text-align:center;font-size:10px;color:#555;margin-bottom:1px}
.p-div{text-align:center;color:#ccc;margin:8px 0;font-size:11px}
.p-meta{font-size:11px;color:#444;line-height:1.8;margin-bottom:2px}
.p-table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}
.p-table th{text-align:left;padding:2px 0;border-bottom:1px dashed #ccc;font-size:10px}
.p-table td{padding:3px 0}
.p-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.p-total{font-weight:700;font-size:14px;padding:5px 0;border-top:1px dashed #ccc;border-bottom:1px dashed #ccc;margin:4px 0;display:flex;justify-content:space-between}
.p-foot{text-align:center;font-size:10px;color:#777;margin-top:8px}
@media print{body>*:not(.rcpt-bg){display:none!important}.rcpt-bg{position:static;background:none;padding:0}.rcpt-box{box-shadow:none;max-height:none}.rcpt-top,.rcpt-acts{display:none!important}.rcpt-scroll{padding:0;background:#fff}.paper{max-width:80mm;margin:0}}
@media(max-width:760px){.pos-wrap{flex-direction:column}.right{width:100%;max-height:48vh}.grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
</style>
</head>
<body>
<div id="navbar-placeholder"></div>
<script src="ruvia-core.js"></script>
<script src="navbar.js"></script>

<div class="pos-wrap">
  <!-- LEFT: Products -->
  <div class="left">
    <div class="toolbar">
      <input class="search" id="srch" placeholder="🔍 Search menu..." oninput="render()">
      <div class="cats" id="cats"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- RIGHT: Cart -->
  <div class="right">
    <div class="cart-hdr">
      <h3>🛒 Order</h3>
      <span class="cashier-tag" id="cashierTag">👤 Staff</span>
    </div>
    <div class="cart-body" id="cartBody">
      <div class="cart-empty">Tap items to add to order</div>
    </div>
    <div class="cart-foot">
      <div class="summary">
        <div class="srow"><span>Subtotal</span><span id="sub">USh 0</span></div>
        <div class="srow"><span>VAT 18%</span><span id="vat">USh 0</span></div>
        <div class="srow big"><span>TOTAL</span><span id="tot">USh 0</span></div>
      </div>
      <div class="pay-row">
        <button class="pbtn on" data-m="cash"   onclick="setPay(this)">💵 Cash</button>
        <button class="pbtn"    data-m="card"   onclick="setPay(this)">💳 Card</button>
        <button class="pbtn"    data-m="mobile" onclick="setPay(this)">📱 Mobile</button>
      </div>
      <div class="meta-row">
        <select id="otype">
          <option value="dine_in">🪑 Dine In</option>
          <option value="takeaway">📦 Takeaway</option>
          <option value="delivery">🛵 Delivery</option>
          <option value="room_service">🏨 Room Service</option>
        </select>
        <input id="tblnum" placeholder="Table / Room #">
      </div>
      <button class="charge-btn" id="chargeBtn" onclick="checkout()" disabled>Charge — USh 0</button>
      <button class="clear-btn" onclick="clearCart()">🗑 Clear</button>
    </div>
  </div>
</div>

<script src="ruvia-store.js"></script>
<script>
// ── constants ────────────────────────────────────────────
const VAT_R = 0.18;
const fmt = n => 'USh ' + Math.round(n||0).toLocaleString();

// ── data layer (works with or without ruvia-store.js) ────
const DB = {
  products(){
    if(window.RuviaStore) return RuviaStore.getProducts();
    try{ return JSON.parse(localStorage.getItem('ruvia_products')||'[]'); }catch(e){ return []; }
  },
  saveOrder(o){
    if(window.RuviaStore){ try{ RuviaStore.saveOrder(o); }catch(e){} }
    try{
      const arr = JSON.parse(localStorage.getItem('ruvia_orders')||'[]');
      arr.unshift(o);
      localStorage.setItem('ruvia_orders', JSON.stringify(arr.slice(0,2000)));
    }catch(e){}
  }
};

// ── seed demo products if none exist ────────────────────
function seedProducts(){
  const existing = DB.products();
  if(existing.length) return;
  const demo=[
    {id:'p1', name:'Grilled Chicken',    emoji:'🍗', category:'maincourse', unit_price:25000, current_stock:50, availability:'available'},
    {id:'p2', name:'Beef Steak',          emoji:'🥩', category:'maincourse', unit_price:45000, current_stock:30, availability:'available'},
    {id:'p3', name:'Fish & Chips',        emoji:'🐟', category:'maincourse', unit_price:28000, current_stock:40, availability:'available'},
    {id:'p4', name:'Vegetable Stew',      emoji:'🥘', category:'maincourse', unit_price:18000, current_stock:60, availability:'available'},
    {id:'p5', name:'Pork Ribs',           emoji:'🍖', category:'maincourse', unit_price:35000, current_stock:25, availability:'available'},
    {id:'p6', name:'Full Breakfast',      emoji:'🍳', category:'breakfast',  unit_price:22000, current_stock:30, availability:'available'},
    {id:'p7', name:'Pancakes',            emoji:'🥞', category:'breakfast',  unit_price:15000, current_stock:40, availability:'available'},
    {id:'p8', name:'Omelette',            emoji:'🍳', category:'breakfast',  unit_price:12000, current_stock:50, availability:'available'},
    {id:'p9', name:'Toast & Eggs',        emoji:'🍞', category:'breakfast',  unit_price:10000, current_stock:60, availability:'available'},
    {id:'p10',name:'Coca Cola',           emoji:'🥤', category:'beverages',  unit_price:4000,  current_stock:100,availability:'available'},
    {id:'p11',name:'Bottled Water',       emoji:'💧', category:'beverages',  unit_price:2000,  current_stock:200,availability:'available'},
    {id:'p12',name:'Fresh Juice',         emoji:'🍊', category:'beverages',  unit_price:8000,  current_stock:50, availability:'available'},
    {id:'p13',name:'Coffee',              emoji:'☕', category:'beverages',  unit_price:6000,  current_stock:80, availability:'available'},
    {id:'p14',name:'Passion Fruit Juice', emoji:'🥭', category:'beverages',  unit_price:7000,  current_stock:60, availability:'available'},
    {id:'p15',name:'Chocolate Cake',      emoji:'🍰', category:'desserts',   unit_price:12000, current_stock:20, availability:'available'},
    {id:'p16',name:'Ice Cream',           emoji:'🍦', category:'desserts',   unit_price:8000,  current_stock:30, availability:'available'},
    {id:'p17',name:'French Fries',        emoji:'🍟', category:'snacks',     unit_price:9000,  current_stock:80, availability:'available'},
    {id:'p18',name:'Spring Rolls',        emoji:'🥟', category:'snacks',     unit_price:12000, current_stock:40, availability:'available'},
    {id:'p19',name:'Samosas',             emoji:'🫓', category:'snacks',     unit_price:8000,  current_stock:60, availability:'available'},
  ];
  localStorage.setItem('ruvia_products', JSON.stringify(demo));
}

// ── state ────────────────────────────────────────────────
let cart = [];
let activeCat = 'all';
let payMethod = 'cash';
let allProds = [];

// ── boot ─────────────────────────────────────────────────
function boot(){
  seedProducts();
  allProds = DB.products().filter(p => p.availability !== 'unavailable');
  document.getElementById('cashierTag').textContent = '👤 ' + (localStorage.getItem('ruviaos_user')||'Staff');
  buildCats();
  render();
}

// ── categories ───────────────────────────────────────────
function buildCats(){
  const cats = ['all', ...[...new Set(allProds.map(p=>p.category).filter(Boolean))]];
  document.getElementById('cats').innerHTML = cats.map(c=>`
    <button class="cat${c===activeCat?' on':''}" onclick="setCat('${c}',this)">
      ${c==='all'?'🍽 All':c.charAt(0).toUpperCase()+c.slice(1)}
    </button>`).join('');
}

function setCat(c, btn){
  activeCat = c;
  document.querySelectorAll('.cat').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

// ── product grid ─────────────────────────────────────────
function render(){
  const q = (document.getElementById('srch').value||'').toLowerCase().trim();
  const list = allProds.filter(p=>{
    if(activeCat !== 'all' && p.category !== activeCat) return false;
    if(q && !p.name.toLowerCase().includes(q)) return false;
    return true;
  });

  const g = document.getElementById('grid');
  if(!list.length){
    g.innerHTML = '<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--text2);font-style:italic">No items found</div>';
    return;
  }
  g.innerHTML = list.map(p=>`
    <div class="tile" onclick="addItem('${p.id}')">
      <span class="tile-emoji">${p.emoji||'🍽'}</span>
      <div class="tile-name">${p.name}</div>
      <div class="tile-price">${fmt(p.unit_price||0)}</div>
    </div>`).join('');
}

// ── cart operations ──────────────────────────────────────
function addItem(id){
  const p = allProds.find(x=>x.id===id);
  if(!p) return;
  const ex = cart.find(i=>i.id===id);
  if(ex){ ex.qty++; } else { cart.push({id:p.id, name:p.name, emoji:p.emoji||'🍽', price:p.unit_price||0, qty:1}); }
  drawCart();
}

function changeQty(id, d){
  const item = cart.find(i=>i.id===id);
  if(!item) return;
  item.qty += d;
  if(item.qty <= 0) cart = cart.filter(i=>i.id!==id);
  drawCart();
}

function clearCart(){
  cart = [];
  drawCart();
}

function drawCart(){
  const body = document.getElementById('cartBody');

  if(!cart.length){
    body.innerHTML = '<div class="cart-empty">Tap items to add to order</div>';
    totals();
    return;
  }

  body.innerHTML = cart.map(item=>`
    <div class="citem">
      <span class="citem-emoji">${item.emoji}</span>
      <div class="citem-info">
        <div class="citem-name">${item.name}</div>
        <div class="citem-unit">${fmt(item.price)} each</div>
      </div>
      <div class="citem-qty">
        <button class="qbtn" onclick="changeQty('${item.id}',-1)">−</button>
        <span class="qnum">${item.qty}</span>
        <button class="qbtn" onclick="changeQty('${item.id}',1)">+</button>
      </div>
      <span class="citem-total">${fmt(item.price*item.qty)}</span>
    </div>`).join('');

  totals();
}

function totals(){
  const sub = cart.reduce((s,i)=>s+i.price*i.qty, 0);
  const vat = Math.round(sub * VAT_R);
  const tot = sub + vat;
  document.getElementById('sub').textContent = fmt(sub);
  document.getElementById('vat').textContent = fmt(vat);
  document.getElementById('tot').textContent = fmt(tot);
  const btn = document.getElementById('chargeBtn');
  btn.disabled = !cart.length;
  btn.textContent = cart.length ? `Charge — ${fmt(tot)}` : 'Charge — USh 0';
}

function setPay(btn){
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  payMethod = btn.dataset.m;
}

// ── checkout ─────────────────────────────────────────────
function checkout(){
  if(!cart.length) return;

  const sub  = cart.reduce((s,i)=>s+i.price*i.qty, 0);
  const vat  = Math.round(sub * VAT_R);
  const tot  = sub + vat;
  const user = localStorage.getItem('ruviaos_user')||'Staff';
  const num  = 'ORD-' + Date.now().toString().slice(-6);
  const now  = new Date().toISOString();

  const order = {
    id: Date.now().toString(), order_number: num,
    items: cart.map(i=>({name:i.name, emoji:i.emoji, quantity:i.qty, unit_price:i.price})),
    subtotal:sub, vat, total:tot,
    payment_method: payMethod,
    order_type: document.getElementById('otype').value,
    table: document.getElementById('tblnum').value.trim()||null,
    cashier: user, status:'completed', created_at: now
  };

  DB.saveOrder(order);

  // activity log
  try{
    const al = JSON.parse(localStorage.getItem('ruvia_activity_log')||'[]');
    al.unshift({id:Date.now(), type:'sale', message:`${user} completed ${num} — ${fmt(tot)}`, username:user, category:'sale', time:now});
    localStorage.setItem('ruvia_activity_log', JSON.stringify(al.slice(0,500)));
  }catch(e){}

  showReceipt(order);
  cart = [];
  drawCart();
  document.getElementById('tblnum').value = '';
}

// ── receipt ──────────────────────────────────────────────
function showReceipt(o){
  const cfg = (()=>{ const d={hotelName:'Ruvia Hotel',address:'Kampala, Uganda',phone:'+256 700 000000',footerMessage:'Thank you! Visit us again.'}; try{return{...d,...JSON.parse(localStorage.getItem('ruvia_hotel_config')||'{}')};}catch(e){return d;} })();
  const ts = new Date(o.created_at);

  const rows = (o.items||[]).map(i=>`
    <tr>
      <td>${i.name}</td>
      <td style="text-align:center;width:30px">${i.quantity}</td>
      <td style="text-align:right;width:72px">${fmt(i.unit_price)}</td>
      <td style="text-align:right;width:76px">${fmt(i.unit_price*i.quantity)}</td>
    </tr>`).join('');

  const modal = document.createElement('div');
  modal.className = 'rcpt-bg';
  modal.id = 'rcpt';
  modal.onclick = e => { if(e.target===modal) modal.remove(); };
  modal.innerHTML = `
    <div class="rcpt-box">
      <div class="rcpt-top">
        <span>🧾 ${o.order_number}</span>
        <button onclick="document.getElementById('rcpt').remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:13px">✕ Close</button>
      </div>
      <div class="rcpt-acts">
        <button class="rbtn" style="background:#2c5f4a;color:#fff" onclick="window.print()">🖨 Print</button>
        <button class="rbtn" style="background:#6c757d;color:#fff" onclick="document.getElementById('rcpt').remove()">Close</button>
      </div>
      <div class="rcpt-scroll">
        <div class="paper">
          <div class="p-hotel">${cfg.hotelName}</div>
          <div class="p-sub">${cfg.address}</div>
          <div class="p-sub">Tel: ${cfg.phone}</div>
          <div class="p-div">- - - - - - - - - - - - - - -</div>
          <div class="p-meta">
            Receipt: <strong>${o.order_number}</strong><br>
            Date: ${ts.toLocaleDateString('en-GB')}<br>
            Time: ${ts.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}<br>
            Cashier: <strong>${o.cashier}</strong><br>
            ${o.table?'Table: '+o.table+'<br>':''}
            Type: ${(o.order_type||'dine_in').replace('_',' ').toUpperCase()}
          </div>
          <div class="p-div">- - - - - - - - - - - - - - -</div>
          <table class="p-table">
            <thead><tr><th>Item</th><th style="text-align:center">Qty</th><th style="text-align:right">Price</th><th style="text-align:right">Total</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="p-div">- - - - - - - - - - - - - - -</div>
          <div class="p-row"><span>Subtotal</span><span>${fmt(o.subtotal)}</span></div>
          <div class="p-row"><span>VAT (18%)</span><span>${fmt(o.vat)}</span></div>
          <div class="p-total"><span>TOTAL</span><span>${fmt(o.total)}</span></div>
          <div class="p-row"><span>Payment</span><span>${(o.payment_method||'cash').toUpperCase()}</span></div>
          <div class="p-div">- - - - - - - - - - - - - - -</div>
          <div class="p-foot">${cfg.footerMessage}</div>
          <div class="p-foot">Powered by RuviaOS</div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>

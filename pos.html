<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>RuviaOS – POS Terminal</title>
<link rel="stylesheet" href="darkmode.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Segoe UI',sans-serif;overflow:hidden;background:var(--bg)}
#navbar-placeholder{position:relative;z-index:20}
.pos-wrap{display:flex;height:calc(100vh - 72px);padding:1rem;gap:1rem}
.products-panel{flex:3;background:var(--bg);display:flex;flex-direction:column;gap:1rem;overflow:hidden}
.search-row{display:flex;gap:0.75rem;margin-bottom:0.5rem}
.search-row input{flex:1;padding:0.75rem 1.25rem;border:1px solid var(--border);border-radius:9999px;font-size:0.875rem;background:var(--card);color:var(--text);outline:none;box-shadow:var(--shadow)}
.search-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,0.1)}
.cats{display:flex;gap:0.5rem;margin-bottom:0.5rem;flex-wrap:wrap}
.cat-btn{padding:0.5rem 1rem;background:var(--card);border:1px solid var(--border);border-radius:9999px;font-size:0.8125rem;font-weight:600;cursor:pointer;box-shadow:var(--shadow);color:var(--text2);transition:all 0.2s}
.cat-btn:hover{background:var(--th-bg);color:var(--text)}
.cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.products-grid{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1.5rem;padding-right:0.5rem}
.group-title{font-size:0.875rem;font-weight:700;color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:0.5rem;margin-bottom:1rem;text-transform:uppercase;letter-spacing:0.05em}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:1rem}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 0.5rem;text-align:center;cursor:pointer;transition:all 0.2s;box-shadow:var(--shadow)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.tile-emoji{font-size:2rem;display:block;margin-bottom:0.5rem}
.tile-name{font-size:0.8125rem;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:0.25rem}
.tile-price{font-size:0.8125rem;color:var(--accent);font-weight:800}
.tile-stock{font-size:0.6875rem;padding:0.125rem 0.5rem;border-radius:9999px;margin-top:0.5rem;display:inline-block;font-weight:700}
.stock-ok{background:rgba(16,185,129,0.1);color:#10b981}
.stock-low{background:rgba(245,158,11,0.1);color:#f59e0b}
.stock-out{background:rgba(239,68,68,0.1);color:#ef4444;cursor:not-allowed}
/* Cart */
.cart-panel{flex:1.2;background:var(--card);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.cart-header{padding:1.25rem;background:var(--header-gradient);color:#fff}
.cart-header h3{font-size:1rem;margin-bottom:1rem;font-weight:800;letter-spacing:-0.01em}
.info-row{display:flex;gap:0.5rem;margin-bottom:0.75rem;flex-wrap:wrap}
.info-select{flex:1;padding:0.5rem;border-radius:8px;border:none;font-size:0.75rem;background:rgba(255,255,255,0.15);color:#fff;font-weight:600}
.info-select option{color:#222}
.guest-row{display:flex;gap:0.5rem;margin-bottom:0.75rem}
.guest-row input{flex:1;padding:0.5rem;border:none;border-radius:8px;font-size:0.75rem;background:rgba(255,255,255,0.15);color:#fff;font-weight:500}
.guest-row input::placeholder{color:rgba(255,255,255,0.6)}
.guest-row button{padding:0.5rem 0.75rem;background:rgba(255,255,255,0.2);border:none;border-radius:8px;font-size:0.75rem;font-weight:700;cursor:pointer;color:#fff}
.guest-select{width:100%;padding:0.5rem;border:none;border-radius:8px;font-size:0.75rem;background:rgba(255,255,255,0.15);color:#fff;cursor:pointer;font-weight:500}
.guest-badge{padding:0.5rem 0.75rem;background:rgba(255,255,255,0.1);border-radius:8px;font-size:0.6875rem;margin-top:0.75rem;min-height:24px;color:rgba(255,255,255,0.8);font-weight:600}
.cart-items{flex:1;overflow-y:auto;padding:1rem}
.cart-item{display:flex;align-items:center;gap:0.5rem;padding:0.75rem 0;border-bottom:1px solid var(--border);font-size:0.8125rem}
.ci-name{flex:2;font-weight:700;color:var(--text)}
.ci-price{font-size:0.6875rem;color:var(--text2);margin-top:0.125rem}
.qty-wrap{display:flex;align-items:center;gap:0.25rem}
.qty-btn{width:24px;height:24px;border:1px solid var(--border);border-radius:50%;background:var(--th-bg);font-size:0.875rem;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;font-weight:700;transition:all 0.2s}
.qty-btn:hover{background:var(--border)}
.ci-total{font-weight:800;min-width:60px;text-align:right;font-size:0.8125rem;color:var(--accent)}
.remove-btn{color:#ef4444;cursor:pointer;font-size:1rem;padding-left:0.5rem;opacity:0.6;transition:all 0.2s}
.remove-btn:hover{opacity:1}
.empty-cart{text-align:center;color:var(--text2);padding:4rem 1rem;font-size:0.875rem;font-weight:500}
.cart-footer{padding:1.25rem;border-top:2px solid var(--border);background:var(--th-bg)}
.cart-total{font-size:1.5rem;font-weight:800;color:var(--accent);text-align:right;margin-bottom:1.25rem;letter-spacing:-0.025em}
.cart-actions{display:flex;gap:0.75rem}
.btn-pay{flex:2;padding:1rem;background:#10b981;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:800;cursor:pointer;transition:all 0.2s;box-shadow:var(--shadow)}
.btn-pay:hover{background:#059669;transform:scale(1.02)}
.btn-clr{flex:1;padding:1rem;background:var(--text2);color:#fff;border:none;border-radius:10px;font-size:0.875rem;font-weight:700;cursor:pointer;transition:all 0.2s}
.btn-clr:hover{background:var(--text)}
/* Modals */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.75);backdrop-filter:blur(4px);justify-content:center;align-items:center;z-index:1000}
.modal-content{background:var(--card);padding:2rem;border-radius:var(--radius);max-width:440px;width:92%;color:var(--text);box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.modal-content h3{margin-bottom:1.5rem;color:var(--accent);font-weight:800;font-size:1.5rem}
.pay-opts{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin:1.5rem 0}
.pay-opt{padding:1rem;border:2px solid var(--border);border-radius:12px;text-align:center;cursor:pointer;background:var(--card);font-weight:700;font-size:0.875rem;color:var(--text);transition:all 0.2s}
.pay-opt:hover{border-color:var(--accent);background:var(--th-bg)}
.pay-opt.selected{border-color:var(--accent);background:rgba(79,70,229,0.1);color:var(--accent)}
.pay-amount{font-size:1.875rem;font-weight:800;text-align:center;color:var(--accent);margin:1rem 0;letter-spacing:-0.025em}
.pay-actions{display:flex;gap:0.75rem;margin-top:1.5rem}
.btn-confirm{flex:1;padding:0.875rem;background:#10b981;color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:0.9375rem}
.btn-cancel-pay{flex:1;padding:0.875rem;background:var(--text2);color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:0.9375rem}
.receipt-box{font-family:'Courier New',Courier,monospace;font-size:0.75rem;background:var(--th-bg);padding:1.25rem;border-radius:10px;margin:1.25rem 0;text-align:center;white-space:pre-wrap;color:var(--text);border:1px solid var(--border);line-height:1.4}
.toast{position:fixed;bottom:2rem;right:2rem;padding:0.875rem 1.25rem;border-radius:10px;display:none;z-index:9999;font-size:0.875rem;font-weight:700;color:#fff;box-shadow:var(--shadow-lg)}
.toast.success{background:#10b981}.toast.error{background:#ef4444}
@media(max-width:900px){.pos-wrap{flex-direction:column;overflow-y:auto;height:auto}.products-panel{max-height:55vh}.cart-panel{min-height:350px}}
</style>
</head>
<body>
<div id="navbar-placeholder"></div>
<script src="navbar.js"></script>
<script src="darkmode.js"></script>
<script src="ruvia-store.js"></script>

<div class="pos-wrap">
  <!-- Products -->
  <div class="products-panel">
    <div class="search-row">
      <input type="text" id="searchBox" placeholder="Search menu items..." oninput="renderProducts()">
      <button class="cat-btn" style="padding:0.5rem" onclick="document.getElementById('searchBox').value='';renderProducts()">✕</button>
    </div>
    <div class="cats" id="catBar"></div>
    <div class="products-grid" id="productsGrid"></div>
  </div>

  <!-- Cart -->
  <div class="cart-panel">
    <div class="cart-header">
      <h3>🧾 Current Order</h3>
      <div class="info-row">
        <select id="orderType" class="info-select" onchange="toggleTableSel()">
          <option value="dine_in"> DINE IN</option>
          <option value="takeaway"> TAKEAWAY</option>
          <option value="room_service"> ROOM SERVICE</option>
        </select>
        <select id="tableSelect" class="info-select" style="display:none">
          <option value="">-- Table --</option>
          <option>Table 1</option><option>Table 2</option><option>Table 3</option>
          <option>Table 4</option><option>Table 5</option><option>Table 6</option>
        </select>
      </div>
      <div class="guest-row">
        <input type="text" id="guestSearch" placeholder="Guest name search...">
        <button onclick="searchGuest()">🔍</button>
      </div>
      <select id="guestDrop" class="guest-select" onchange="selectGuest(this.value)">
        <option value="">-- Walk-in / No guest --</option>
      </select>
      <div class="guest-badge" id="guestBadge">No guest selected</div>
    </div>

    <div class="cart-items" id="cartItems"></div>

    <div class="cart-footer">
      <div class="cart-total" id="cartTotal">UGX 0</div>
      <div class="cart-actions">
        <button class="btn-pay" onclick="openPayModal()">Checkout</button>
        <button class="btn-clr" onclick="clearCart()">Clear</button>
      </div>
    </div>
  </div>
</div>

<!-- Payment Modal -->
<div id="payModal" class="modal">
  <div class="modal-content">
    <h3>💳 Payment</h3>
    <div class="pay-amount" id="payAmount">UGX 0</div>
    <div class="pay-opts">
      <div class="pay-opt" onclick="pickPay('cash',this)">💵 Cash</div>
      <div class="pay-opt" onclick="pickPay('momo',this)">📱 MoMo</div>
      <div class="pay-opt" onclick="pickPay('card',this)">💳 Card</div>
      <div class="pay-opt" onclick="pickPay('room',this)">🏨 Room</div>
    </div>
    <div class="pay-actions">
      <button class="btn-confirm" onclick="confirmPayment()">✓ Confirm</button>
      <button class="btn-cancel-pay" onclick="closeModal('payModal')">Cancel</button>
    </div>
  </div>
</div>

<!-- Receipt Modal -->
<div id="receiptModal" class="modal">
  <div class="modal-content" style="text-align:center">
    <h3>✅ Order Complete</h3>
    <div class="receipt-box" id="receiptBox"></div>
    <button class="btn-confirm" style="width:100%;margin-top:0.5rem" onclick="closeModal('receiptModal');clearCart()">New Order</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let cart=[], selectedGuest=null, selectedPayMethod=null;
const fmt=n=>'UGX '+Math.round(n||0).toLocaleString();

function toast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function closeModal(id){document.getElementById(id).style.display='none';}
window.onclick=e=>{if(e.target.classList.contains('modal'))e.target.style.display='none';}

// Categories
const catMeta={all:{label:'📋 All'},breakfast:{label:'🍳 Breakfast'},maincourse:{label:'🍽️ Main'},snacks:{label:'🍔 Snacks'},beverages:{label:'🥤 Drinks'},spa:{label:'💆 Spa'}};
let activeCat='all';

function buildCatBar(){
  const products=RuviaStore.getProducts();
  const cats=['all',...new Set(products.map(p=>p.category))];
  document.getElementById('catBar').innerHTML=cats.map(c=>`<button class="cat-btn${c===activeCat?' active':''}" onclick="selectCat('${c}')">${(catMeta[c]||{label:c}).label}</button>`).join('');
}
function selectCat(c){activeCat=c;buildCatBar();renderProducts();}

function toggleTableSel(){
  const v=document.getElementById('orderType').value;
  document.getElementById('tableSelect').style.display=v==='dine_in'?'block':'none';
}

function searchGuest(){
  const q=document.getElementById('guestSearch').value.toLowerCase();
  const guests=RuviaStore.getGuests();
  const matches=guests.filter(g=>g.full_name.toLowerCase().includes(q)||String(g.phone).includes(q));
  const drop=document.getElementById('guestDrop');
  drop.innerHTML='<option value="">-- Select --</option>'+matches.map(g=>`<option value="${g.id}">${g.full_name} (${g.phone||'?'})</option>`).join('');
}
function loadGuestDrop(){
  const guests=RuviaStore.getGuests();
  document.getElementById('guestDrop').innerHTML='<option value="">-- Walk-in / No guest --</option>'+guests.map(g=>`<option value="${g.id}">${g.full_name}</option>`).join('');
}
function selectGuest(id){
  if(!id){selectedGuest=null;document.getElementById('guestBadge').textContent='No guest selected';return;}
  const g=RuviaStore.getGuests().find(x=>x.id==id);
  selectedGuest=g||null;
  document.getElementById('guestBadge').textContent=g?`👤 ${g.full_name} — ${g.phone||''}`:'-';
}

function renderProducts(){
  const products=RuviaStore.getProducts();
  const q=document.getElementById('searchBox').value.toLowerCase();
  let list=products.filter(p=>activeCat==='all'||p.category===activeCat);
  if(q) list=list.filter(p=>p.name.toLowerCase().includes(q)||p.category.includes(q));
  // Group by category
  const groups={};
  list.forEach(p=>{if(!groups[p.category])groups[p.category]=[];groups[p.category].push(p);});
  const grid=document.getElementById('productsGrid');
  if(list.length===0){grid.innerHTML=`<div style="text-align:center;padding:40px;color:var(--text2)">No items found</div>`;return;}
  grid.innerHTML=Object.entries(groups).map(([cat,items])=>`
    <div class="product-group">
      <div class="group-title">${(catMeta[cat]||{label:cat}).label} ${cat.charAt(0).toUpperCase()+cat.slice(1)}</div>
      <div class="items-grid">${items.map(p=>{
        const out=p.current_stock===0;
        const low=p.current_stock>0&&p.current_stock<=p.reorder_level;
        return `<div class="tile${out?' stock-out':''}" onclick="${out?'':('addToCart('+p.id+')')}">
          <span class="tile-emoji">${p.emoji||'🍴'}</span>
          <div class="tile-name">${p.name}</div>
          <div class="tile-price">${fmt(p.unit_price)}</div>
          <div class="tile-stock ${out?'stock-out':low?'stock-low':'stock-ok'}">${out?'Out of stock':low?'Low: '+p.current_stock:'Stock: '+p.current_stock}</div>
        </div>`;}).join('')}
      </div>
    </div>`).join('');
}

function addToCart(pid){
  const p=RuviaStore.getProducts().find(x=>x.id===pid);
  if(!p||p.current_stock===0){toast('Out of stock','error');return;}
  const existing=cart.find(c=>c.product_id===pid);
  if(existing){
    if(existing.quantity>=p.current_stock){toast('Not enough stock','error');return;}
    existing.quantity++;
  } else {
    cart.push({product_id:pid,name:p.name,unit_price:p.unit_price,quantity:1,emoji:p.emoji||'🍴'});
  }
  renderCart();
}
function changeQty(pid,delta){
  const i=cart.findIndex(c=>c.product_id===pid);
  if(i<0)return;
  cart[i].quantity+=delta;
  if(cart[i].quantity<=0)cart.splice(i,1);
  renderCart();
}
function removeItem(pid){cart=cart.filter(c=>c.product_id!==pid);renderCart();}
function clearCart(){cart=[];selectedGuest=null;selectedPayMethod=null;document.getElementById('guestBadge').textContent='No guest selected';document.getElementById('guestDrop').value='';renderCart();}

function renderCart(){
  const total=cart.reduce((s,c)=>s+c.unit_price*c.quantity,0);
  document.getElementById('cartTotal').textContent=fmt(total);
  if(cart.length===0){document.getElementById('cartItems').innerHTML=`<div class="empty-cart">🛒<br>Cart is empty<br><small>Tap items to add</small></div>`;return;}
  document.getElementById('cartItems').innerHTML=cart.map(c=>`<div class="cart-item">
    <div class="ci-name">${c.emoji} ${c.name}<div class="ci-price">${fmt(c.unit_price)} each</div></div>
    <div class="qty-wrap">
      <button class="qty-btn" onclick="changeQty(${c.product_id},-1)">-</button>
      <span style="font-size:0.875rem;font-weight:800;min-width:24px;text-align:center">${c.quantity}</span>
      <button class="qty-btn" onclick="changeQty(${c.product_id},1)">+</button>
    </div>
    <div class="ci-total">${fmt(c.unit_price*c.quantity)}</div>
    <span class="remove-btn" onclick="removeItem(${c.product_id})">✕</span>
  </div>`).join('');
}

function openPayModal(){
  if(cart.length===0){toast('Cart is empty','error');return;}
  const total=cart.reduce((s,c)=>s+c.unit_price*c.quantity,0);
  document.getElementById('payAmount').textContent=fmt(total);
  selectedPayMethod=null;
  document.querySelectorAll('.pay-opt').forEach(o=>o.classList.remove('selected'));
  document.getElementById('payModal').style.display='flex';
}
function pickPay(m,el){selectedPayMethod=m;document.querySelectorAll('.pay-opt').forEach(o=>o.classList.remove('selected'));el.classList.add('selected');}

function confirmPayment(){
  if(!selectedPayMethod){toast('Select payment method','error');return;}
  const total=cart.reduce((s,c)=>s+c.unit_price*c.quantity,0);
  const table=document.getElementById('tableSelect').value||'';
  const orderId=RuviaStore.addOrder({
    items:cart.map(c=>({product_id:c.product_id,name:c.name,quantity:c.quantity,unit_price:c.unit_price})),
    total,payment_method:selectedPayMethod,
    order_type:document.getElementById('orderType').value,
    table,guest_id:selectedGuest?selectedGuest.id:null,
    guest_name:selectedGuest?selectedGuest.full_name:'Walk-in',
  });
  closeModal('payModal');
  const now=new Date().toLocaleTimeString();
  document.getElementById('receiptBox').textContent=`===== RUVIA HOTEL =====\nOrder #: ORD-${String(orderId).padStart(4,'0')}\nTime: ${now}\n${selectedGuest?'Guest: '+selectedGuest.full_name+'\n':''}\n${cart.map(c=>c.emoji+' '+c.name.padEnd(16).slice(0,16)+' x'+c.quantity+' '+fmt(c.unit_price*c.quantity).padStart(10)).join('\n')}\n\n${'─'.repeat(30)}\nTOTAL:  ${fmt(total).padStart(22)}\nPaid via: ${selectedPayMethod.toUpperCase().padStart(20)}\n${'═'.repeat(30)}\nThank you! Come again!`;
  document.getElementById('receiptModal').style.display='flex';
  renderProducts(); // refresh stock display
}

// Init
buildCatBar();renderProducts();renderCart();loadGuestDrop();
RuviaStore.onChange(()=>{renderProducts();loadGuestDrop();});
</script>
</body>
</html>

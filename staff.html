<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RuviaOS – Staff Management</title>
<link rel="stylesheet" href="darkmode.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;padding:20px}
.container{max-width:1400px;margin:0 auto}
.header{background:linear-gradient(135deg,#1a3c34,#2c5f4a);color:#fff;padding:18px 22px;border-radius:12px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--card,#fff);padding:16px;border-radius:12px;text-align:center;box-shadow:var(--shadow)}
.stat-value{font-size:28px;font-weight:700;color:var(--accent,#2c5f4a)}
.stat-label{color:var(--text2,#666);margin-top:4px;font-size:12px}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;min-width:180px;padding:9px 14px;border:1px solid var(--input-border,#ddd);border-radius:8px;font-size:13px;background:var(--input-bg,#fff);color:var(--text,#222)}
.btn{padding:9px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px;margin:2px;transition:all .2s}
.btn-primary{background:var(--accent,#2c5f4a);color:#fff}
.btn-primary:hover{background:var(--accent2,#1a3c34)}
.btn-warning{background:#ffc107;color:#333}
.btn-danger{background:#dc3545;color:#fff}
.btn-success{background:#28a745;color:#fff}
.btn-sm{padding:5px 10px;font-size:11px}
.table-container{background:var(--card,#fff);border-radius:12px;overflow-x:auto;box-shadow:var(--shadow);margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--border,#eee);font-size:12px}
th{background:var(--th-bg,#f8f9fa);font-weight:600;color:var(--text,#222)}
tr:hover{background:var(--row-hover,#f5f7fa)}
.badge{padding:3px 9px;border-radius:14px;font-size:11px;font-weight:700;display:inline-block}
.b-admin{background:#f8d7da;color:#721c24}
.b-manager{background:#fff3cd;color:#856404}
.b-reception{background:#d1ecf1;color:#0c5460}
.b-kitchen{background:#d4edda;color:#155724}
.b-housekeeping{background:#e2e3e5;color:#383d41}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);justify-content:center;align-items:center;z-index:1000}
.modal-content{background:var(--card,#fff);padding:22px;border-radius:14px;max-width:480px;width:92%;max-height:85vh;overflow-y:auto;color:var(--text,#222)}
.modal-content h3{margin-bottom:14px;color:var(--accent,#2c5f4a)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-weight:600;margin-bottom:4px;font-size:12px;color:var(--text2,#555)}
.form-group input,.form-group select{width:100%;padding:9px;border:1px solid var(--input-border,#ddd);border-radius:7px;font-size:13px;background:var(--input-bg,#fff);color:var(--text,#222)}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:9px;display:none;z-index:9999;font-size:13px;font-weight:600;color:#fff}
.toast.success{background:#28a745}.toast.error{background:#dc3545}
@media(max-width:768px){th,td{font-size:11px;padding:8px}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="navbar-placeholder"></div>
<script>fetch('navbar.html').then(r=>r.text()).then(d=>{document.getElementById('navbar-placeholder').innerHTML=d;});</script>
<script src="darkmode.js"></script>

<div class="container">
<div class="header">
  <h1>👥 Staff Management</h1>
  <button class="btn btn-success" onclick="openModal()">➕ Register Employee</button>
</div>

<div class="stats-grid">
  <div class="stat-card"><div class="stat-value" id="stTotal">-</div><div class="stat-label">Total Staff</div></div>
  <div class="stat-card"><div class="stat-value" id="stActive" style="color:#28a745">-</div><div class="stat-label">Active</div></div>
  <div class="stat-card"><div class="stat-value" id="stInactive" style="color:#dc3545">-</div><div class="stat-label">Inactive</div></div>
  <div class="stat-card"><div class="stat-value" id="stRoles">-</div><div class="stat-label">Roles</div></div>
</div>

<div class="toolbar">
  <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search by name, role, or department..." oninput="render()">
  <button class="btn btn-primary" onclick="document.getElementById('searchInput').value='';render()">Clear</button>
</div>

<div class="table-container"><table>
  <thead><tr><th>Staff Code</th><th>Full Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Department</th><th>Status</th><th>Actions</th></tr></thead>
  <tbody id="staffBody"></tbody>
</table></div>
</div>

<!-- Modal -->
<div id="staffModal" class="modal">
  <div class="modal-content">
    <h3 id="mTitle">Register Employee</h3>
    <div class="form-row">
      <div class="form-group"><label>Staff Code *</label><input id="mCode" placeholder="STAFF-001"></div>
      <div class="form-group"><label>Full Name *</label><input id="mName" placeholder="Full name"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Email</label><input type="email" id="mEmail" placeholder="email@ruvia.com"></div>
      <div class="form-group"><label>Phone</label><input id="mPhone" placeholder="07xxxxxxxx"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Role *</label>
        <select id="mRole">
          <option value="admin">👑 Administrator</option>
          <option value="manager">📊 Manager</option>
          <option value="reception" selected>🏨 Receptionist</option>
          <option value="kitchen">🍳 Kitchen Staff</option>
          <option value="housekeeping">🧹 Housekeeping</option>
        </select>
      </div>
      <div class="form-group"><label>Department</label><input id="mDept" placeholder="Front Office"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Hire Date</label><input type="date" id="mHire"></div>
      <div class="form-group"><label>Status</label>
        <select id="mStatus"><option value="true">Active</option><option value="false">Inactive</option></select>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-primary" onclick="saveStaff()">💾 Save</button>
      <button class="btn btn-danger" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// Staff is stored in localStorage independently (not in ruvia-store products)
const STAFF_KEY='ruvia_staff';
const ROLE_LABELS={admin:'👑 Admin',manager:'📊 Manager',reception:'🏨 Reception',kitchen:'🍳 Kitchen',housekeeping:'🧹 Housekeeping'};
const ROLE_BADGES={admin:'b-admin',manager:'b-manager',reception:'b-reception',kitchen:'b-kitchen',housekeeping:'b-housekeeping'};

function getStaff(){try{const d=localStorage.getItem(STAFF_KEY);return d?JSON.parse(d):getDefaultStaff();}catch(e){return getDefaultStaff();}}
function saveStaffData(d){localStorage.setItem(STAFF_KEY,JSON.stringify(d));}
function getDefaultStaff(){const d=[
  {id:1,staff_code:'ADMIN-001',full_name:'System Administrator',email:'admin@ruvia.com',phone:'0700111111',role:'admin',department:'Management',is_active:true,hire_date:'2024-01-15'},
  {id:2,staff_code:'MGR-001',full_name:'Sarah Johnson',email:'sarah@ruvia.com',phone:'0700222222',role:'manager',department:'Management',is_active:true,hire_date:'2024-02-01'},
  {id:3,staff_code:'REC-001',full_name:'John Otim',email:'john@ruvia.com',phone:'0700333333',role:'reception',department:'Front Office',is_active:true,hire_date:'2024-02-10'},
  {id:4,staff_code:'REC-002',full_name:'Mary Nambi',email:'mary@ruvia.com',phone:'0700444444',role:'reception',department:'Front Office',is_active:true,hire_date:'2024-03-01'},
  {id:5,staff_code:'KIT-001',full_name:'James Mukasa',email:'james@ruvia.com',phone:'0700555555',role:'kitchen',department:'F&B',is_active:true,hire_date:'2024-01-20'},
  {id:6,staff_code:'HK-001',full_name:'Peter Okello',email:'peter@ruvia.com',phone:'0700777777',role:'housekeeping',department:'Housekeeping',is_active:true,hire_date:'2024-01-25'},
  {id:7,staff_code:'HK-002',full_name:'Florence Achieng',email:'flo@ruvia.com',phone:'0700888888',role:'housekeeping',department:'Housekeeping',is_active:false,hire_date:'2024-02-20'}
];saveStaffData(d);return d;}

let _editId=null;
function toast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
function closeModal(){document.getElementById('staffModal').style.display='none';}
window.onclick=e=>{if(e.target.classList.contains('modal'))e.target.style.display='none';}

function render(){
  const staff=getStaff();
  const q=document.getElementById('searchInput').value.toLowerCase();
  const list=q?staff.filter(s=>s.full_name.toLowerCase().includes(q)||(s.email||'').toLowerCase().includes(q)||s.role.includes(q)||(s.department||'').toLowerCase().includes(q)||s.staff_code.toLowerCase().includes(q)):staff;
  document.getElementById('stTotal').textContent=staff.length;
  document.getElementById('stActive').textContent=staff.filter(s=>s.is_active).length;
  document.getElementById('stInactive').textContent=staff.filter(s=>!s.is_active).length;
  document.getElementById('stRoles').textContent=new Set(staff.map(s=>s.role)).size;
  document.getElementById('staffBody').innerHTML=list.length===0
    ?`<tr><td colspan="8" style="text-align:center;color:var(--text2);padding:24px">No staff found</td></tr>`
    :list.map(s=>`<tr>
        <td style="font-family:monospace;font-size:11px"><strong>${s.staff_code}</strong></td>
        <td><strong>${s.full_name}</strong></td>
        <td style="font-size:11px">${s.email||'-'}</td>
        <td>${s.phone||'-'}</td>
        <td><span class="badge ${ROLE_BADGES[s.role]||''}">${ROLE_LABELS[s.role]||s.role}</span></td>
        <td>${s.department||'-'}</td>
        <td>${s.is_active?'<span style="color:#28a745;font-weight:600">● Active</span>':'<span style="color:#dc3545;font-weight:600">● Inactive</span>'}</td>
        <td>
          <button class="btn btn-warning btn-sm" onclick="editStaff(${s.id})">✏️</button>
          <button class="btn ${s.is_active?'btn-danger':'btn-success'} btn-sm" onclick="toggleActive(${s.id})">${s.is_active?'Deactivate':'Activate'}</button>
        </td>
      </tr>`).join('');
}

function openModal(){
  _editId=null;document.getElementById('mTitle').textContent='Register Employee';
  ['mCode','mName','mEmail','mPhone','mDept'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('mRole').value='reception';document.getElementById('mStatus').value='true';
  document.getElementById('mHire').value=new Date().toISOString().slice(0,10);
  document.getElementById('staffModal').style.display='flex';
}
function editStaff(id){
  const s=getStaff().find(x=>x.id===id);if(!s)return;
  _editId=id;document.getElementById('mTitle').textContent='Edit Employee';
  document.getElementById('mCode').value=s.staff_code||'';document.getElementById('mName').value=s.full_name||'';
  document.getElementById('mEmail').value=s.email||'';document.getElementById('mPhone').value=s.phone||'';
  document.getElementById('mRole').value=s.role||'reception';document.getElementById('mDept').value=s.department||'';
  document.getElementById('mHire').value=s.hire_date||'';document.getElementById('mStatus').value=s.is_active?'true':'false';
  document.getElementById('staffModal').style.display='flex';
}
function saveStaff(){
  const code=document.getElementById('mCode').value.trim();
  const name=document.getElementById('mName').value.trim();
  if(!code||!name){toast('Enter staff code and name','error');return;}
  const d={staff_code:code,full_name:name,email:document.getElementById('mEmail').value,phone:document.getElementById('mPhone').value,role:document.getElementById('mRole').value,department:document.getElementById('mDept').value,hire_date:document.getElementById('mHire').value,is_active:document.getElementById('mStatus').value==='true'};
  const staff=getStaff();
  if(_editId){const i=staff.findIndex(s=>s.id===_editId);if(i>=0){staff[i]={...staff[i],...d};saveStaffData(staff);toast('Employee updated');}
  } else {d.id=Date.now();staff.push(d);saveStaffData(staff);toast('Employee registered');}
  closeModal();render();
}
function toggleActive(id){
  const staff=getStaff();const s=staff.find(x=>x.id===id);if(!s)return;
  const action=s.is_active?'deactivate':'activate';
  if(!confirm(action+' '+s.full_name+'?'))return;
  s.is_active=!s.is_active;saveStaffData(staff);toast(s.full_name+(s.is_active?' activated':' deactivated'));render();
}

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){
  var s=localStorage.getItem('ruvia-dark');
  if(s==='1'||(!s&&window.matchMedia('(prefers-color-scheme:dark)').matches))
    document.documentElement.classList.add('dark-mode'),document.documentElement.style.background='#0f1117';
})()</script>
<script src="ruvia-auth-guard.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RuviaOS — Stock</title>
<script>(function(){if(localStorage.getItem('ruvia-dark')==='1')document.documentElement.style.background='#0f1117';})()</script>
<link rel="stylesheet" href="darkmode.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6f9;--card:#fff;--text:#1a1a2e;--text2:#6b7280;--border:#e5e7eb;--accent:#2c5f4a;--accent-light:#e8f5f0;--input-bg:#fff;--th-bg:#f9fafb;--row-hover:#f3f4f6;--shadow-md:0 4px 16px rgba(0,0,0,.08)}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
.page{max-width:1400px;margin:0 auto;padding:24px}
.phdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.phdr h1{font-size:22px;font-weight:700}
.hacts{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{opacity:.9}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text2);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;border-top:3px solid var(--accent)}
.tile.warn{border-top-color:#e0a800}.tile.danger{border-top-color:#dc3545}.tile.info{border-top-color:#17a2b8}
.tv{font-size:24px;font-weight:700;color:var(--text);line-height:1}
.tl{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
/* alert */
.alert{background:#fdecea;border:1px solid #f5c6cb;border-radius:11px;padding:13px 16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:12px}
.alert-text{font-size:13px;color:#721c24;flex:1}
.alert-btn{background:#dc3545;color:#fff;border:none;padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0}
/* toolbar */
.tbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.fbtn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.fbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.srch{padding:8px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;background:var(--input-bg);color:var(--text);outline:none;margin-left:auto;width:210px}
.srch:focus{border-color:var(--accent)}
/* table */
.twrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;min-width:680px}
th{padding:11px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;background:var(--th-bg);border-bottom:1px solid var(--border)}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border:none}
tr:hover td{background:var(--row-hover)}
.bar-wrap{width:90px;height:7px;background:var(--th-bg);border-radius:99px;overflow:hidden}
.bar{height:100%;border-radius:99px}
.bar.ok{background:#28a745}.bar.low{background:#e0a800}.bar.out{background:#dc3545}
.badge{padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700}
.b-ok{background:#d4edda;color:#155724}
.b-low{background:#fff3cd;color:#856404}
.b-out{background:#f8d7da;color:#721c24}
.ab{padding:5px 9px;border:1.5px solid var(--border);border-radius:7px;background:transparent;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;transition:.15s;margin-right:3px}
.ab:hover{border-color:var(--accent);color:var(--accent)}
.ab.red:hover{border-color:#dc3545;color:#dc3545}
.restock-wrap{display:flex;align-items:center;gap:5px}
.ri{width:58px;padding:5px 7px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;background:var(--input-bg);color:var(--text);outline:none;text-align:center}
.ri:focus{border-color:var(--accent)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.mhdr{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.mhdr h3{font-size:16px;font-weight:700}
.mbody{padding:20px}
.mfoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;background:var(--input-bg);color:var(--text);outline:none;font-family:inherit}
.fg input:focus,.fg select:focus{border-color:var(--accent)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-save{background:var(--accent);color:#fff;border:none;padding:10px 22px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.btn-cancel{background:transparent;border:1.5px solid var(--border);color:var(--text2);padding:10px 18px;border-radius:9px;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div id="navbar-placeholder"></div>
<script src="ruvia-core.js"></script>
<script src="navbar.js"></script>

<div class="page">
  <div class="phdr">
    <h1>📦 Stock Management</h1>
    <div class="hacts">
      <button class="btn-outline" onclick="exportCSV()">📥 Export CSV</button>
      <button class="btn" onclick="openAdd()">+ Add Item</button>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>
  <div id="alertBox" style="display:none"></div>

  <div class="tbar">
    <button class="fbtn on" onclick="setFilter('all',this)">All</button>
    <button class="fbtn" onclick="setFilter('low',this)">⚠️ Low Stock</button>
    <button class="fbtn" onclick="setFilter('out',this)">🚫 Out of Stock</button>
    <div id="catBtns" style="display:flex;gap:5px;flex-wrap:wrap"></div>
    <input class="srch" id="srch" placeholder="Search items..." oninput="renderTable()">
  </div>

  <div class="twrap">
    <table>
      <thead><tr><th>Item</th><th>Category</th><th>Stock</th><th>Reorder Level</th><th>Unit Price</th><th>Status</th><th>Restock</th><th>Actions</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- Add/Edit modal -->
<div class="overlay" id="itemModal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <div class="mhdr"><h3 id="mTitle">Add Item</h3><button onclick="document.getElementById('itemModal').style.display='none'" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2)">✕</button></div>
    <div class="mbody">
      <div class="f2">
        <div class="fg"><label>Item Name</label><input id="iName" placeholder="e.g. Bottled Water"></div>
        <div class="fg"><label>Category</label><select id="iCat"><option value="beverages">Beverages</option><option value="food">Food</option><option value="cleaning">Cleaning</option><option value="amenities">Amenities</option><option value="equipment">Equipment</option><option value="other">Other</option></select></div>
        <div class="fg"><label>Current Stock</label><input type="number" id="iStock" placeholder="0" min="0"></div>
        <div class="fg"><label>Reorder Level</label><input type="number" id="iReorder" placeholder="10" min="0"></div>
        <div class="fg"><label>Unit Price (USh)</label><input type="number" id="iPrice" placeholder="0" min="0"></div>
        <div class="fg"><label>Unit (e.g. bottles)</label><input id="iUnit" placeholder="units"></div>
      </div>
      <div class="fg"><label>Supplier / Notes</label><textarea id="iNotes" rows="2" placeholder="Supplier or notes..."></textarea></div>
    </div>
    <div class="mfoot">
      <button class="btn-cancel" onclick="document.getElementById('itemModal').style.display='none'">Cancel</button>
      <button class="btn-save" onclick="saveItem()">Save Item</button>
    </div>
  </div>
</div>

<script src="ruvia-store.js"></script>
<script>
const fmt = n => 'USh ' + Math.round(n||0).toLocaleString();
let stockFilter = 'all';
let editId = null;

// ── data layer ────────────────────────────────────────────
const DB = {
  get(){    try{ return window.RuviaStore?RuviaStore.getProducts():JSON.parse(localStorage.getItem('ruvia_products')||'[]');}catch(e){return[];} },
  save(p){  if(window.RuviaStore){RuviaStore.saveProduct(p);}else{const a=DB.get();const i=a.findIndex(x=>x.id===p.id);if(i>=0)a[i]=p;else a.push(p);localStorage.setItem('ruvia_products',JSON.stringify(a));} },
  del(id){  const a=DB.get().filter(x=>x.id!==id); if(window.RuviaStore){localStorage.setItem('ruvia_products',JSON.stringify(a));}else{localStorage.setItem('ruvia_products',JSON.stringify(a));} }
};

// ── seed demo stock ───────────────────────────────────────
function seed(){
  if(DB.get().length) return;
  const demo=[
    {id:'s1', name:'Coca Cola 500ml',    emoji:'🥤',category:'beverages',unit_price:3500, current_stock:48, reorder_level:20,unit:'bottles'},
    {id:'s2', name:'Bottled Water 1L',   emoji:'💧',category:'beverages',unit_price:1500, current_stock:120,reorder_level:50,unit:'bottles'},
    {id:'s3', name:'Fanta Orange',       emoji:'🍊',category:'beverages',unit_price:3500, current_stock:3,  reorder_level:20,unit:'bottles'},
    {id:'s4', name:'Beer (Nile Special)',emoji:'🍺',category:'beverages',unit_price:6000, current_stock:0,  reorder_level:12,unit:'bottles'},
    {id:'s5', name:'Rice 5kg',           emoji:'🍚',category:'food',     unit_price:22000,current_stock:15, reorder_level:5, unit:'bags'},
    {id:'s6', name:'Cooking Oil 5L',     emoji:'🫙',category:'food',     unit_price:35000,current_stock:4,  reorder_level:3, unit:'jerricans'},
    {id:'s7', name:'Chicken (whole)',    emoji:'🐔',category:'food',     unit_price:18000,current_stock:8,  reorder_level:5, unit:'pieces'},
    {id:'s8', name:'Toilet Paper (roll)',emoji:'🧻',category:'amenities',unit_price:1200, current_stock:80, reorder_level:30,unit:'rolls'},
    {id:'s9', name:'Hand Soap Bar',      emoji:'🧼',category:'amenities',unit_price:2500, current_stock:2,  reorder_level:10,unit:'bars'},
    {id:'s10',name:'Bleach 1L',          emoji:'🧴',category:'cleaning', unit_price:4000, current_stock:12, reorder_level:5, unit:'bottles'},
    {id:'s11',name:'Mop Head',           emoji:'🧹',category:'cleaning', unit_price:8000, current_stock:0,  reorder_level:2, unit:'pieces'},
    {id:'s12',name:'Sugar 2kg',          emoji:'🍬',category:'food',     unit_price:8000, current_stock:10, reorder_level:5, unit:'bags'},
  ];
  localStorage.setItem('ruvia_products',JSON.stringify(demo));
}

// ── boot ─────────────────────────────────────────────────
function boot(){ seed(); renderTiles(); buildCatBtns(); renderTable(); checkAlerts(); }

function setFilter(f,btn){
  stockFilter=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  renderTable();
}

// ── tiles ─────────────────────────────────────────────────
function renderTiles(){
  const p=DB.get();
  const low=p.filter(x=>x.current_stock>0&&x.current_stock<=x.reorder_level).length;
  const out=p.filter(x=>x.current_stock<=0).length;
  const val=p.reduce((s,x)=>s+(x.unit_price||0)*(x.current_stock||0),0);
  document.getElementById('tiles').innerHTML=[
    {lbl:'Total Items',val:p.length,cls:''},
    {lbl:'Low Stock',val:low,cls:'warn'},
    {lbl:'Out of Stock',val:out,cls:'danger'},
    {lbl:'Stock Value',val:'USh '+Math.round(val/1000)+'K',cls:'info'},
  ].map(t=>`<div class="tile ${t.cls}"><div class="tv">${t.val}</div><div class="tl">${t.lbl}</div></div>`).join('');
}

// ── category buttons ──────────────────────────────────────
function buildCatBtns(){
  const cats=[...new Set(DB.get().map(p=>p.category).filter(Boolean))];
  document.getElementById('catBtns').innerHTML=cats.map(c=>`
    <button class="fbtn" onclick="setFilter('cat:${c}',this)">${c.charAt(0).toUpperCase()+c.slice(1)}</button>`).join('');
}

// ── alert banner ──────────────────────────────────────────
function checkAlerts(){
  const p=DB.get();
  const issues=[...p.filter(x=>x.current_stock<=0).map(x=>`${x.name} OUT`), ...p.filter(x=>x.current_stock>0&&x.current_stock<=x.reorder_level).map(x=>`${x.name} LOW (${x.current_stock})`)];
  const box=document.getElementById('alertBox');
  if(!issues.length){box.style.display='none';return;}
  box.style.display='block';
  box.innerHTML=`<div class="alert"><span style="font-size:20px">⚠️</span><div class="alert-text"><strong>${issues.length} stock alert${issues.length>1?'s':''}:</strong> ${issues.slice(0,4).join(', ')}${issues.length>4?'…':''}</div><button class="alert-btn" onclick="notifyManager()">Notify Manager</button></div>`;
}

function notifyManager(){
  const p=DB.get();
  const issues=p.filter(x=>x.current_stock<=x.reorder_level).map(x=>`${x.name}: ${x.current_stock} left`).join(', ');
  ['manager','admin'].forEach(u=>{
    try{
      const n=JSON.parse(localStorage.getItem('ruvia_notifications')||'[]');
      n.unshift({id:Date.now(),targetUser:u,type:'alert',title:`⚠️ Stock Alert`,body:`Items need restocking: ${issues}`,read:false,time:new Date().toISOString(),link:'stock.html'});
      localStorage.setItem('ruvia_notifications',JSON.stringify(n.slice(0,200)));
    }catch(e){}
  });
  alert('✅ Manager and Admin have been notified.');
}

// ── table ─────────────────────────────────────────────────
function renderTable(){
  const q=document.getElementById('srch').value.toLowerCase();
  const list=DB.get().filter(p=>{
    if(q&&!p.name.toLowerCase().includes(q)) return false;
    if(stockFilter==='low') return p.current_stock>0&&p.current_stock<=p.reorder_level;
    if(stockFilter==='out') return p.current_stock<=0;
    if(stockFilter.startsWith('cat:')) return p.category===stockFilter.slice(4);
    return true;
  });

  if(!list.length){document.getElementById('tbody').innerHTML=`<tr><td colspan="8" style="text-align:center;padding:28px;color:var(--text2);font-style:italic">No items found</td></tr>`;return;}

  document.getElementById('tbody').innerHTML=list.map(p=>{
    const s=p.current_stock??0, r=p.reorder_level??5;
    const isOut=s<=0, isLow=!isOut&&s<=r;
    const max=Math.max(r*3,s,10);
    const pct=Math.min(100,Math.round(s/max*100));
    const barcls=isOut?'out':isLow?'low':'ok';
    const badge=isOut?'<span class="badge b-out">Out of Stock</span>':isLow?'<span class="badge b-low">Low Stock</span>':'<span class="badge b-ok">In Stock</span>';
    return `
      <tr>
        <td><div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px">${p.emoji||'📦'}</span><div><div style="font-weight:600">${p.name}</div><div style="font-size:11px;color:var(--text2)">${p.unit||'units'}</div></div></div></td>
        <td style="text-transform:capitalize">${p.category||'—'}</td>
        <td><div style="font-weight:700;margin-bottom:4px">${s}</div><div class="bar-wrap"><div class="bar ${barcls}" style="width:${pct}%"></div></div></td>
        <td>${r}</td>
        <td>${p.unit_price?fmt(p.unit_price):'—'}</td>
        <td>${badge}</td>
        <td><div class="restock-wrap"><input type="number" class="ri" id="ri_${p.id}" placeholder="+qty" min="1"><button class="ab" onclick="restock('${p.id}')">Add</button></div></td>
        <td><button class="ab" onclick="openEdit('${p.id}')">✏️</button><button class="ab red" onclick="delItem('${p.id}')">🗑</button></td>
      </tr>`;
  }).join('');
}

function restock(id){
  const qty=parseInt(document.getElementById('ri_'+id)?.value)||0;
  if(qty<=0){alert('Enter a quantity greater than 0.');return;}
  const p=DB.get().find(x=>x.id===id);
  if(!p)return;
  p.current_stock=(p.current_stock||0)+qty;
  DB.save(p);
  const u=localStorage.getItem('ruviaos_user')||'staff';
  try{const a=JSON.parse(localStorage.getItem('ruvia_activity_log')||'[]');a.unshift({id:Date.now(),type:'stock',message:`${u} restocked ${p.name} +${qty} (now ${p.current_stock})`,username:u,category:'stock',time:new Date().toISOString()});localStorage.setItem('ruvia_activity_log',JSON.stringify(a.slice(0,500)));}catch(e){}
  renderTiles(); renderTable(); checkAlerts();
}

// ── add / edit ────────────────────────────────────────────
function openAdd(){
  editId=null;
  document.getElementById('mTitle').textContent='Add Stock Item';
  ['iName','iStock','iReorder','iPrice','iUnit','iNotes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('iCat').value='food';
  document.getElementById('itemModal').style.display='flex';
}

function openEdit(id){
  const p=DB.get().find(x=>x.id===id);if(!p)return;
  editId=id;
  document.getElementById('mTitle').textContent='Edit: '+p.name;
  document.getElementById('iName').value=p.name||'';
  document.getElementById('iCat').value=p.category||'food';
  document.getElementById('iStock').value=p.current_stock??'';
  document.getElementById('iReorder').value=p.reorder_level??'';
  document.getElementById('iPrice').value=p.unit_price||'';
  document.getElementById('iUnit').value=p.unit||'';
  document.getElementById('iNotes').value=p.notes||'';
  document.getElementById('itemModal').style.display='flex';
}

function saveItem(){
  const name=document.getElementById('iName').value.trim();
  if(!name){alert('Item name is required.');return;}
  const item={
    id:editId||'s'+Date.now(), name,
    category:document.getElementById('iCat').value,
    current_stock:parseInt(document.getElementById('iStock').value)||0,
    reorder_level:parseInt(document.getElementById('iReorder').value)||5,
    unit_price:parseFloat(document.getElementById('iPrice').value)||0,
    unit:document.getElementById('iUnit').value||'units',
    notes:document.getElementById('iNotes').value,
    emoji:'📦', availability:'available'
  };
  DB.save(item);
  document.getElementById('itemModal').style.display='none';
  renderTiles(); buildCatBtns(); renderTable(); checkAlerts();
}

function delItem(id){
  if(!confirm('Delete this stock item?'))return;
  DB.del(id);
  renderTiles(); renderTable(); checkAlerts();
}

function exportCSV(){
  const p=DB.get();
  const csv='Name,Category,Stock,Reorder,Unit Price,Unit,Status\n'+p.map(x=>`"${x.name}","${x.category||''}",${x.current_stock??0},${x.reorder_level??5},${x.unit_price||0},"${x.unit||'units'}","${(x.current_stock??0)<=0?'Out':(x.current_stock??0)<=(x.reorder_level??5)?'Low':'OK'}"`).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stock.csv';a.click();
}

if(window.RuviaStore) RuviaStore.onChange(()=>{renderTiles();renderTable();checkAlerts();});
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>

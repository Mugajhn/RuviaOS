<!DOCTYPE html>
<html lang="en">
<head>
  
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RuviaOS — Tables</title>
<script>(function(){if(localStorage.getItem('ruvia-dark')==='1')document.documentElement.style.background='#0f1117';})()</script>
<link rel="stylesheet" href="darkmode.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6f9;--card:#fff;--text:#1a1a2e;--text2:#6b7280;--border:#e5e7eb;--accent:#2c5f4a;--accent-light:#e8f5f0;--input-bg:#fff;--th-bg:#f9fafb;--shadow-md:0 4px 16px rgba(0,0,0,.08)}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
.page{max-width:1400px;margin:0 auto;padding:24px}
.phdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.phdr h1{font-size:22px;font-weight:700}
.btn{background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{opacity:.9}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.tile.success{border-top:3px solid #28a745}.tile.warn{border-top:3px solid #e0a800}.tile.info{border-top:3px solid #17a2b8}.tile.plain{border-top:3px solid var(--accent)}
.tv{font-size:24px;font-weight:700;color:var(--text);line-height:1}
.tl{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
/* filter */
.fbar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.fbtn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.fbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* tables grid */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px;margin-bottom:22px}
.tc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;text-align:center;border-top:4px solid var(--border);position:relative}
.tc:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.tc.available{border-top-color:#28a745}
.tc.occupied{border-top-color:#dc3545}
.tc.reserved{border-top-color:#e0a800}
.tc.cleaning{border-top-color:#17a2b8}
.tc-icon{font-size:36px;margin-bottom:8px;display:block}
.tc-num{font-size:18px;font-weight:700}
.tc-seats{font-size:12px;color:var(--text2);margin-bottom:8px}
.tc-status{font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;display:inline-block}
.ts-available{background:#d4edda;color:#155724}
.ts-occupied{background:#f8d7da;color:#721c24}
.ts-reserved{background:#fff3cd;color:#856404}
.ts-cleaning{background:#d1ecf1;color:#0c5460}
.tc-waiter{font-size:11px;color:var(--text2);margin-top:5px}
.tc-waiter span{font-weight:600;color:var(--accent)}
.order-badge{position:absolute;top:9px;right:9px;background:#dc3545;color:#fff;font-size:9px;font-weight:700;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center}
/* orders list */
.osec{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.osec-hdr{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.osec-hdr h3{font-size:14px;font-weight:700}
.oitem{display:flex;align-items:flex-start;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border)}
.oitem:last-child{border-bottom:none}
.otbl{width:38px;height:38px;border-radius:50%;background:var(--th-bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0}
.oinfo{flex:1;min-width:0}
.oname{font-size:13px;font-weight:600}
.ometa{font-size:11px;color:var(--text2);margin-top:2px}
/* modals */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.mhdr{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.mhdr h3{font-size:16px;font-weight:700}
.mbody{padding:20px}
.mfoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.fg input,.fg select{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;background:var(--input-bg);color:var(--text);outline:none}
.fg input:focus,.fg select:focus{border-color:var(--accent)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-save{background:var(--accent);color:#fff;border:none;padding:10px 22px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.btn-cancel{background:transparent;border:1.5px solid var(--border);color:var(--text2);padding:10px 18px;border-radius:9px;font-size:13px;cursor:pointer}
/* status chooser */
.schoice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.schoice button{padding:11px;border-radius:9px;border:2px solid var(--border);background:var(--card);font-size:12px;font-weight:600;cursor:pointer;color:var(--text);transition:.15s}
.schoice button:hover,.schoice button.act{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.dr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.dr:last-child{border:none}
.dr span:first-child{color:var(--text2)}
</style>
</head>
<body>
<div id="navbar-placeholder"></div>
<script src="ruvia-core.js"></script>
<script src="navbar.js"></script>

<div class="page">
  <div class="phdr">
    <h1>🍽 Table Management</h1>
    <button class="btn" onclick="openAddTable()">+ Add Table</button>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="fbar">
    <button class="fbtn on" onclick="setFilter('all',this)">All Tables</button>
    <button class="fbtn" onclick="setFilter('available',this)">🟢 Available</button>
    <button class="fbtn" onclick="setFilter('occupied',this)">🔴 Occupied</button>
    <button class="fbtn" onclick="setFilter('reserved',this)">🟡 Reserved</button>
    <button class="fbtn" onclick="setFilter('cleaning',this)">🔵 Cleaning</button>
  </div>

  <div class="tgrid" id="tablesGrid"></div>

  <div class="osec">
    <div class="osec-hdr"><h3>📋 Recent Dine-In Orders</h3><span id="ordersCount" style="font-size:12px;color:var(--text2)"></span></div>
    <div id="ordersList"></div>
  </div>
</div>

<!-- Table action modal -->
<div class="overlay" id="tableModal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <div class="mhdr"><h3 id="tmTitle">Table</h3><button onclick="document.getElementById('tableModal').style.display='none'" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2)">✕</button></div>
    <div class="mbody">
      <div id="tmInfo" style="margin-bottom:14px"></div>
      <p style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;margin-bottom:8px">Change Status</p>
      <div class="schoice" id="tmChoices"></div>
      <div id="tmWaiterSection" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
        <p style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;margin-bottom:8px">Assign Waiter / Notify Staff</p>
        <div class="f2">
          <div class="fg"><label>Staff Member</label><select id="tmStaff"></select></div>
          <div class="fg"><label>Message</label><input id="tmMsg" placeholder="Needs attention"></div>
        </div>
        <button class="btn-save" style="width:100%;padding:9px" onclick="notifyWaiter()">🔔 Send Notification</button>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn-cancel" onclick="document.getElementById('tableModal').style.display='none'">Close</button>
    </div>
  </div>
</div>

<!-- Add table modal -->
<div class="overlay" id="addModal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal" style="max-width:360px">
    <div class="mhdr"><h3>➕ Add Table</h3><button onclick="document.getElementById('addModal').style.display='none'" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2)">✕</button></div>
    <div class="mbody">
      <div class="f2">
        <div class="fg"><label>Table Number/Name</label><input id="atNum" placeholder="e.g. T1"></div>
        <div class="fg"><label>Seats</label><input type="number" id="atSeats" placeholder="4" min="1"></div>
      </div>
      <div class="fg"><label>Location</label><select id="atLoc"><option value="indoor">Indoor</option><option value="outdoor">Outdoor/Terrace</option><option value="private">Private Dining</option><option value="bar">Bar Area</option></select></div>
    </div>
    <div class="mfoot">
      <button class="btn-cancel" onclick="document.getElementById('addModal').style.display='none'">Cancel</button>
      <button class="btn-save" onclick="addTable()">Add Table</button>
    </div>
  </div>
</div>

<script src="ruvia-store.js"></script>
<script>
const fmt = n => 'USh '+Math.round(n||0).toLocaleString();
let tableFilter = 'all';
let activeTableId = null;

// ── data helpers ──────────────────────────────────────────
const DB = {
  tables(){ try{return JSON.parse(localStorage.getItem('ruvia_tables')||'[]');}catch(e){return[];} },
  save(arr){ localStorage.setItem('ruvia_tables',JSON.stringify(arr)); },
  setStatus(id,s){ const a=DB.tables().map(t=>t.id===id?{...t,status:s,openedAt:s==='occupied'&&!DB.tables().find(x=>x.id===id)?.openedAt?new Date().toISOString():s==='available'||s==='cleaning'?null:DB.tables().find(x=>x.id===id)?.openedAt}:t);DB.save(a); },
  setWaiter(id,w){ const a=DB.tables().map(t=>t.id===id?{...t,waiter:w}:t);DB.save(a); },
  orders(){ try{return window.RuviaStore?RuviaStore.getOrders():JSON.parse(localStorage.getItem('ruvia_orders')||'[]');}catch(e){return[];} },
  staff(){ try{return JSON.parse(localStorage.getItem('ruvia_staff')||'[]');}catch(e){return[];} }
};

// ── seed tables ───────────────────────────────────────────
function seed(){
  if(DB.tables().length) return;
  const tables=[];
  const locs=['indoor','indoor','indoor','indoor','outdoor','outdoor','private','bar'];
  const seats=[2,4,4,6,4,4,8,6];
  for(let i=0;i<8;i++) tables.push({id:'tbl'+(i+1),number:'T'+(i+1),seats:seats[i],location:locs[i],status:'available',waiter:null,openedAt:null});
  DB.save(tables);
}

function boot(){ seed(); renderTiles(); renderTables(); renderOrders(); populateStaffSelects(); }

function setFilter(f,btn){
  tableFilter=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  renderTables();
}

// ── tiles ─────────────────────────────────────────────────
function renderTiles(){
  const t=DB.tables();
  const orders=DB.orders().filter(o=>o.order_type==='dine_in');
  document.getElementById('tiles').innerHTML=[
    {lbl:'Available',val:t.filter(x=>x.status==='available').length,cls:'success'},
    {lbl:'Occupied', val:t.filter(x=>x.status==='occupied').length, cls:'warn'},
    {lbl:'Reserved', val:t.filter(x=>x.status==='reserved').length, cls:''},
    {lbl:'Dine-In Orders',val:orders.length,cls:'info'},
  ].map(t=>`<div class="tile ${t.cls} plain"><div class="tv">${t.val}</div><div class="tl">${t.lbl}</div></div>`).join('');
}

// ── tables grid ───────────────────────────────────────────
function renderTables(){
  const tables=DB.tables().filter(t=>tableFilter==='all'||t.status===tableFilter);
  const orders=DB.orders();
  const SC={available:'ts-available',occupied:'ts-occupied',reserved:'ts-reserved',cleaning:'ts-cleaning'};
  const SL={available:'🟢 Available',occupied:'🔴 Occupied',reserved:'🟡 Reserved',cleaning:'🔵 Cleaning'};
  const icon=s=>s<=2?'🪑':s<=4?'🍽':'🎉';
  const el=document.getElementById('tablesGrid');
  if(!tables.length){el.innerHTML='<div style="grid-column:1/-1;padding:32px;text-align:center;color:var(--text2);font-style:italic">No tables match this filter</div>';return;}
  el.innerHTML=tables.map(t=>{
    const tOrders=orders.filter(o=>o.table===t.number&&o.order_type==='dine_in').length;
    const elapsed=t.openedAt?Math.round((Date.now()-new Date(t.openedAt))/60000):null;
    return `
      <div class="tc ${t.status}" onclick="openTableModal('${t.id}')">
        ${tOrders?`<div class="order-badge">${tOrders}</div>`:''}
        <span class="tc-icon">${icon(t.seats)}</span>
        <div class="tc-num">${t.number}</div>
        <div class="tc-seats">👥 ${t.seats} seats · ${t.location}</div>
        <span class="tc-status ${SC[t.status]||''}">${SL[t.status]||t.status}</span>
        ${t.waiter?`<div class="tc-waiter">Waiter: <span>${t.waiter}</span></div>`:''}
        ${elapsed!==null?`<div style="font-size:10px;color:var(--text2);margin-top:4px">Open ${elapsed}min</div>`:''}
      </div>`;
  }).join('');
}

// ── table modal ───────────────────────────────────────────
function openTableModal(id){
  activeTableId=id;
  const t=DB.tables().find(x=>x.id===id);if(!t)return;
  document.getElementById('tmTitle').textContent=`Table ${t.number}`;
  document.getElementById('tmInfo').innerHTML=`
    <div class="dr"><span>Location</span><span style="text-transform:capitalize">${t.location}</span></div>
    <div class="dr"><span>Seats</span><span>${t.seats}</span></div>
    <div class="dr"><span>Waiter</span><span>${t.waiter||'—'}</span></div>
    <div class="dr"><span>Status</span><span style="text-transform:capitalize">${t.status}</span></div>`;
  document.getElementById('tmChoices').innerHTML=
    ['available','occupied','reserved','cleaning'].map(s=>`
      <button class="${s===t.status?'act':''}" onclick="changeTableStatus('${id}','${s}')">
        ${{available:'🟢 Available',occupied:'🔴 Occupied',reserved:'🟡 Reserved',cleaning:'🔵 Cleaning'}[s]}
      </button>`).join('');
  document.getElementById('tmMsg').value=`Table ${t.number} needs attention`;
  document.getElementById('tableModal').style.display='flex';
}

function changeTableStatus(id,status){
  const tables=DB.tables();
  const t=tables.find(x=>x.id===id);if(!t)return;
  t.status=status;
  if(status==='occupied'&&!t.openedAt) t.openedAt=new Date().toISOString();
  if(status==='available'||status==='cleaning'){t.openedAt=null;t.waiter=null;}
  DB.save(tables);
  log(`Table ${t.number} → ${status}`,'tables');
  renderTiles(); renderTables();
  // refresh modal
  openTableModal(id);
}

function notifyWaiter(){
  const target=document.getElementById('tmStaff').value;
  const msg=document.getElementById('tmMsg').value.trim()||'Table needs attention';
  const t=DB.tables().find(x=>x.id===activeTableId);

  // assign waiter
  if(activeTableId){ DB.setWaiter(activeTableId,target); }

  try{
    const n=JSON.parse(localStorage.getItem('ruvia_notifications')||'[]');
    n.unshift({id:Date.now(),targetUser:target,type:'task',title:`🍽 ${t?.number}: ${msg}`,body:msg,read:false,time:new Date().toISOString(),link:'tables.html'});
    localStorage.setItem('ruvia_notifications',JSON.stringify(n.slice(0,200)));
  }catch(e){}
  log(`Notified ${target}: ${msg}`,'notification');
  renderTables();
  alert(`✅ Notification sent to ${target}`);
}

function populateStaffSelects(){
  const staff=DB.staff();
  const sel=document.getElementById('tmStaff');
  sel.innerHTML='<option value="kitchen">kitchen (default)</option>'+staff.map(s=>`<option value="${s.username}">${s.name}</option>`).join('');
}

// ── orders list ───────────────────────────────────────────
function renderOrders(){
  const orders=DB.orders().filter(o=>o.order_type==='dine_in'||o.table).slice(0,10);
  document.getElementById('ordersCount').textContent=orders.length+' orders';
  if(!orders.length){document.getElementById('ordersList').innerHTML='<div style="padding:20px;text-align:center;color:var(--text2);font-size:12px;font-style:italic">No dine-in orders yet</div>';return;}
  document.getElementById('ordersList').innerHTML=orders.map(o=>`
    <div class="oitem">
      <div class="otbl">${o.table||'?'}</div>
      <div class="oinfo">
        <div class="oname">${o.order_number} — Table ${o.table||'?'}</div>
        <div class="ometa">${(o.items||[]).slice(0,3).map(i=>`${i.name}×${i.quantity}`).join(', ')} · ${fmt(o.total)} · ${o.cashier} · ${new Date(o.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
    </div>`).join('');
}

// ── add table ─────────────────────────────────────────────
function openAddTable(){ document.getElementById('atNum').value=''; document.getElementById('atSeats').value='4'; document.getElementById('addModal').style.display='flex'; }
function addTable(){
  const num=document.getElementById('atNum').value.trim();
  if(!num){alert('Enter a table number or name.');return;}
  const tables=DB.tables();
  tables.push({id:'tbl'+Date.now(),number:num,seats:parseInt(document.getElementById('atSeats').value)||4,location:document.getElementById('atLoc').value,status:'available',waiter:null,openedAt:null});
  DB.save(tables);
  document.getElementById('addModal').style.display='none';
  renderTiles(); renderTables();
}

function log(msg,type){ const u=localStorage.getItem('ruviaos_user')||'staff'; try{const a=JSON.parse(localStorage.getItem('ruvia_activity_log')||'[]');a.unshift({id:Date.now(),type,message:msg,username:u,category:type,time:new Date().toISOString()});localStorage.setItem('ruvia_activity_log',JSON.stringify(a.slice(0,500)));}catch(e){} }

if(window.RuviaStore) RuviaStore.onChange(()=>{renderTiles();renderTables();renderOrders();});
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Test Guests API</title>
</head>
<body>
    <!-- Navigation Bar -->
<div id="navbar-placeholder"></div>

<script>
    fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar-placeholder').innerHTML = data;
        });
</script>
    <h1>Test Guests API</h1>
    <button onclick="testGuests()">Test /api/guests</button>
    <button onclick="testSimple()">Test Simple Query</button>
    <pre id="result">Click a button to test...</pre>

    <script>
        async function testGuests() {
            document.getElementById('result').innerHTML = 'Loading...';
            try {
                const response = await fetch('/api/guests');
                const data = await response.json();
                document.getElementById('result').innerHTML = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        }

        async function testSimple() {
            document.getElementById('result').innerHTML = 'Loading...';
            try {
                const response = await fetch('/api/guests-simple');
                const data = await response.json();
                document.getElementById('result').innerHTML = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
